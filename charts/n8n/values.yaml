# yaml-language-server: $schema=values.schema.json
# Default values for n8n.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: n8nio/n8n
  # -- This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- This will set the deployment strategy more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
strategy:
  type: "RollingUpdate"
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: "25%"

# -- The number of old ReplicaSets to retain for rollback. More information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#clean-up-policy
revisionHistoryLimit: ~

# -- This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- This is for setting Kubernetes Annotations to a Pod. For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod. For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- This is for setting Security Context to a Pod. For more information checkout: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# -- This is for setting Security Context to a Container. For more information checkout: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000

# -- Image for the `wait-for-main` init containers that block worker, webhook and MCP webhook pods
#    until the main node is ready. The default tag floats within the busybox 1.36 line, so patch
#    updates are picked up without a chart change.
waitContainer:
  image:
    # -- Repository for the wait-for-main init container.
    repository: busybox
    # -- Tag for the wait-for-main init container.
    tag: "1.38"
    # -- Pull policy for the wait-for-main init container.
    pullPolicy: IfNotPresent

# -- Security Context for the wait-for-main busybox init containers.
waitContainerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000

# -- This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- Whether to enable the service
  enabled: true
  # -- This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # -- This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 5678
  # -- Default Service name
  name: http
  # -- Additional service annotations
  annotations: {}
  # -- Additional service labels
  labels: {}

# -- n8n log configurations
log:
  # -- The log output level. The available options are (from lowest to highest level) are error, warn, info, and debug. The default value is info. You can learn more about these options [here](https://docs.n8n.io/hosting/logging-monitoring/logging/#log-levels).
  level: info
  # -- Log output format. `text` prints human-readable messages; `json` prints one JSON object per line (useful for log aggregation pipelines).
  format: text
  # -- Where to output logs to. Options are: `console` or `file` or both.
  output:
    - console

  # -- Scopes to filter logs by. Nothing is filtered by default. Supported log scopes: concurrency, external-secrets, license, multi-main-setup, pubsub, redis, scaling, waiting-executions
  scopes: []
    # - concurrency
    # - external-secrets
    # - license
    # - multi-main-setup
    # - pubsub
    # - redis
    # - scaling
    # - waiting-executions

  file:
    # -- Absolute path for the log file. Must be inside a writable volume (e.g. the n8n data volume at `/home/node/.n8n`). Only for `file` log output.
    location: "/home/node/.n8n/logs/n8n.log"
    # -- The maximum size (in MB) for each log file. By default, n8n uses 16 MB.
    maxsize: 16
    # -- Max number of log files to keep, or max number of days to keep logs for. Once the limit is reached, the oldest log files will be rotated out. If using days, append a `d` suffix. Only for `file` log output.
    maxcount: "100"

# -- Node configurations for built-in and external npm packages
nodes:
  # -- Enable built-in node functions (e.g., HTTP Request, Code Node, etc.)
  builtin:
    # -- Enable built-in modules for the Code node
    enabled: false
    # -- List of built-in Node.js modules to allow in the Code node (e.g., crypto, fs). Use '*' to allow all.
    modules: []
      # - crypto
      # - fs
  # -- Nodes that should not be loaded, rendered as `NODES_EXCLUDE`. Leave unset (`~`) to use the n8n default, which excludes `n8n-nodes-base.executeCommand` and `n8n-nodes-base.localFileTrigger` from n8n 2.0 onwards. Set to `[]` to load every node, or list node types to exclude more of them.
  exclude: ~
    # - n8n-nodes-base.executeCommand
  # -- Nodes that should be loaded, rendered as `NODES_INCLUDE`. Leave unset (`~`) to load everything that isn't excluded.
  include: ~
    # - n8n-nodes-base.code
  # -- Compression node limits. n8n 3.0 lowered the upstream defaults from 2 GiB / 5000 entries to 256 MiB / 1000 entries; raise them here if workflows unpack larger archives.
  compression:
    # -- Maximum total decompressed output size in bytes (`N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES`). Unset uses the n8n default (268435456, i.e. 256 MiB).
    maxDecompressedSizeBytes: ~
    # -- Maximum number of entries allowed in a ZIP archive (`N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES`). Unset uses the n8n default (1000).
    maxZipEntries: ~
  # -- External npm packages to install and allow in the Code node
  external:
    # -- Allow all external npm packages
    allowAll: false
    # -- Whether to reinstall missing packages. For more information, see https://docs.n8n.io/integrations/community-nodes/troubleshooting/#error-missing-packages
    reinstallMissingPackages: false
    # -- List of npm package names and versions (e.g., "package-name@1.0.0")
    packages: []
      # - "moment@2.29.4"
      # - "lodash@4.17.21"
    # -- Persistence for community node packages installed by the init container. Optional PVC so packages survive pod restarts without re-downloading.
    persistence:
      # -- Enable persistence. When false, packages are installed into an emptyDir and lost on pod restart.
      enabled: false
      # -- Use an existing PVC instead of creating one. When set, no PVC is created by this chart.
      existingClaim: ""
      # -- Storage class for the PVC. Empty string uses the cluster default.
      storageClass: ""
      # -- Access mode. Use ReadWriteMany when worker pods may be scheduled on different nodes.
      accessMode: ReadWriteOnce
      # -- Size of the PVC.
      size: 1Gi
      # -- Additional annotations for the PVC.
      annotations: {}
  # -- Image for the init container to install npm packages
  initContainer:
    # -- Image for the init container to install npm packages
    image:
      # -- Repository for the init container to install npm packages
      repository: node
      # -- Tag for the init container to install npm packages
      tag: "24-alpine"
      # -- Pull policy for the init container to install npm packages
      pullPolicy: IfNotPresent
    # -- Resources for the init container
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 128Mi
      # limits:
      #   cpu: 500m
      #   memory: 256Mi
  # -- Python Code node configuration. Requires n8n 1.111.0+ and taskRunners.mode: external.
  python:
    # -- Enable Python code execution in the Code node via external task runners.
    enabled: false
    # -- Built-in Python module access for the Code node.
    builtin:
      # -- Python standard library modules allowed in Code nodes. Use ['*'] to allow all.
      modules: []
        # - "*"
    # -- External Python package access for the Code node.
    external:
      # -- Allow all external Python packages in Code nodes. When true, sets N8N_RUNNERS_EXTERNAL_ALLOW=* regardless of packages list.
      allowAll: false
      # -- Python packages to install via uv before starting the runner (e.g. ["pandas", "numpy"]). Each listed package is also automatically allowed as an external package in Code nodes.
      packages: []
        # - pandas
        # - numpy
    # -- Persistence for Python packages installed by uv. Optional PVC so packages survive pod restarts without re-downloading.
    persistence:
      # -- Enable persistence. When false, packages are installed into an emptyDir and lost on pod restart.
      enabled: false
      # -- Use an existing PVC instead of creating one. When set, no PVC is created by this chart.
      existingClaim: ""
      # -- Storage class for the PVC. Empty string uses the cluster default.
      storageClass: ""
      # -- Access mode. Use ReadWriteMany when worker pods may be scheduled on different nodes.
      accessMode: ReadWriteOnce
      # -- Size of the PVC.
      size: 1Gi
      # -- Additional annotations for the PVC.
      annotations: {}

# -- Configuration for private Python package (PyPI) registry. Used by the runner sidecar when nodes.python.external.packages is set.
pypiRegistry:
  # -- Enable private PyPI registry support for the runner sidecar.
  enabled: false
  # -- URL of the private PyPI index (e.g. https://my.jfrog.io/artifactory/api/pypi/pypi/simple/).
  # Used when no config file is provided; sets UV_DEFAULT_INDEX in the sidecar.
  # For authenticated registries embed credentials inline or use customUvConfig/secretName instead.
  url: ""
  # -- Name of an existing Kubernetes secret whose data contains a uv.toml config file.
  # When set, the file is mounted into the runner sidecar and UV_CONFIG_FILE is set.
  secretName: ""
  # -- Key within the secret that holds the uv.toml content.
  secretKey: "uv.toml"
  # -- Inline uv.toml content. When set and secretName is empty, the chart creates a Secret
  # from this content (mirrors customNpmrc behaviour). Mutually exclusive with url.
  customUvConfig: ""

# -- Configuration for private npm registry
npmRegistry:
  # -- Enable private npm registry
  enabled: false
  # -- URL of the private npm registry (e.g., https://registry.npmjs.org/)
  url: ""
  # -- Name of the Kubernetes secret containing npm registry credentials
  secretName: ""
  # -- Key in the secret for the .npmrc content or auth token
  secretKey: "npmrc"
  # -- Custom .npmrc content (optional, overrides secret if provided)
  customNpmrc: ""

# -- Configuration for binary data storage
binaryData:
  # -- The binary data mode. `filesystem` stores binary data on disk, `database` in the database, `s3` in an S3-compatible store. Leave unset (`~`) to use the n8n default for the deployment mode: `filesystem` in regular mode, `database` in queue mode. Note that n8n 2.0 removed the in-memory mode, so `default` is no longer accepted. Binary data pruning operates on the active mode only. For more information, see https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/binary-data/
  mode: ~
  # -- Path for binary data storage in `filesystem` mode. If not set, n8n uses `<N8N_USER_FOLDER>/binaryData`. For more information, see https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/binary-data/
  localStoragePath: ""
  # -- Maximum size (in MiB) of a single file n8n stores when `binaryData.mode` is `database`. Cannot exceed `1024`, which is the database column limit; storing a larger file fails. Only rendered when `binaryData.mode` is `database`.
  databaseMaxFileSize: 512
  # -- S3-compatible external storage configurations. Only used when `binaryData.mode` is `s3`. For more information, see https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/external-data-storage/
  s3:
    # -- Host of the n8n bucket in S3-compatible external storage. For example, s3.us-east-1.amazonaws.com
    host: ""
    # -- Name of the n8n bucket in S3-compatible external storage.
    bucketName: ""
    # -- Region of the n8n bucket in S3-compatible external storage. For example, us-east-1
    bucketRegion: "us-east-1"
    # -- Access key in S3-compatible external storage
    accessKey: ""
    # -- Access secret in S3-compatible external storage.
    accessSecret: ""
    # -- This is for setting up the s3 file storage existing secret. Must contain access-key-id and secret-access-key keys.
    existingSecret: ""

# -- n8n database configurations
db:
  # -- Prefix to use for table names.
  tablePrefix: ""
  # -- Type of database to use. Valid values 'sqlite' | 'postgresdb'
  type: sqlite

  logging:
    # -- Whether database logging is enabled.
    enabled: false
    # -- Database logging level. Requires `maxQueryExecutionTime` to be higher than `0`. Valid values 'query' | 'error' | 'schema' | 'warn' | 'info' | 'log' | 'all'
    options: error
    # -- Only queries that exceed this time (ms) will be logged. Set `0` to disable.
    maxQueryExecutionTime: 0

  sqlite:
    # -- SQLite database file name
    database: "database.sqlite"
    # -- SQLite database pool size (`DB_SQLITE_POOL_SIZE`). n8n 2.0 removed the legacy driver, so this pooling driver (WAL mode, one writer plus a pool of readers) is the only one. Must be at least `1`; n8n defaults to `3`.
    poolSize: 3
    # -- Runs VACUUM operation on startup to rebuild the database. Reduces file size and optimizes indexes. This is a long running blocking operation and increases start-up time.
    vacuum: false

  postgresdb:
    # -- Control how many parallel open Postgres connections n8n should have. Increasing it may help with resource utilization, but too many connections may degrade performance.
    poolSize: 2
    # -- Postgres connection timeout (ms).
    connectionTimeout: 20000
    # -- Amount of time before an idle connection is eligible for eviction for being idle.
    idleConnectionTimeout: 30000
    # -- The PostgreSQL schema.
    schema: public
    # -- The PostgreSQL connection SSL settings. Find more information from here: https://docs.n8n.io/hosting/configuration/supported-databases-settings/#postgresdb
    ssl:
      # -- Whether to enable SSL.
      enabled: false
      # -- The PostgreSQL base64 encoded version of SSL certificate authority file content.
      base64EncodedCertificateAuthorityFile: ""
      # -- The PostgreSQL base64 encoded version of SSL certificate file content.
      base64EncodedCertFile: ""
      # -- The PostgreSQL base64 encoded version of SSL private key file content.
      base64EncodedPrivateKeyFile: ""
      # -- The PostgreSQL existing certificate authority file secret.
      existingCertificateAuthorityFileSecret:
        # -- The name of the existing secret.
        name: ""
        # -- The key of the certificate authority file in the existing secret.
        key: "ca.crt"
      # -- The PostgreSQL existing certificate file secret.
      existingCertFileSecret:
        # -- The name of the existing secret.
        name: ""
        # -- The key of the certificate file in the existing secret.
        key: "cert.crt"
      # -- The PostgreSQL existing SSL private key file secret.
      existingPrivateKeyFileSecret:
        # -- The name of the existing secret.
        name: ""
        # -- The key of the SSL private key file in the existing secret.
        key: "cert.key"
      # -- If n8n should reject unauthorized SSL connections (true) or not (false).
      rejectUnauthorized: true

sentry:
  # -- Whether sentry is enabled.
  enabled: false
  # -- Sentry DSN for backend.
  backendDsn: ""
  # -- Sentry DSN for frontend.
  frontendDsn: ""
  # -- Sentry DSN for external task runners.
  externalTaskRunnersDsn: ""

diagnostics:
  # -- Whether diagnostics are enabled.
  enabled: false

  # -- Diagnostics config for frontend.
  frontendConfig: "1zPn9bgWPzlQc0p8Gj1uiK6DOTn;https://telemetry.n8n.io"
  # -- Diagnostics config for backend.
  backendConfig: "1zPn7YoGC3ZXE9zLeTKLuQCB4F6;https://telemetry.n8n.io"

  postHog:
    # -- API key for PostHog.
    apiKey: "phc_4URIAm1uYfJO7j8kWSe0J8lc8IqnstRLS7Jx8NcakHo"
    # -- API host for PostHog.
    apiHost: "https://ph.n8n.io"

versionNotifications:
  # -- Whether to request notifications about new n8n versions
  enabled: false
  # -- Endpoint to retrieve n8n version information from
  endpoint: "https://api.n8n.io/api/versions/"
  # -- URL for versions panel to page instructing user on how to update n8n instance
  infoUrl: "https://docs.n8n.io/hosting/installation/updating/"

api:
  # -- Whether to enable the Public API
  enabled: true
  # -- Path segment for the Public API
  path: api
  # -- Whether to enable the Swagger UI for the Public API
  swagger:
    enabled: true

# -- n8n enterprise license configurations
license:
  # -- Whether to enable the enterprise license
  enabled: false
  # -- Activation key to initialize license. Not applicable if the n8n instance was already activated. For more information please refer to the following link: https://docs.n8n.io/enterprise-key/
  activationKey: ""
  # -- The name of an existing secret with license activation key. The secret must contain a key with the name N8N_LICENSE_ACTIVATION_KEY.
  existingActivationKeySecret: ""
  # -- The auto new license configuration
  autoRenew:
    # -- Enables (true) or disables (false) autorenewal for licenses. If disabled, you need to manually renew the license every 10 days by navigating to Settings > Usage and plan, and pressing F5. Failure to renew the license will disable Enterprise features.
    enabled: true
    # -- Time in hours before expiry a license should automatically renew.
    offsetInHours: 72
  # -- Server URL to retrieve license.
  serverUrl: "https://license.n8n.io/v1"
  # -- Tenant ID associated with the license. Only set this variable if explicitly instructed by n8n.
  tenantId: 1

# -- Main node configurations
main:
  # -- Number of main nodes. Only enterprise license users can have one leader main node and multiple follower main nodes.
  #    Setting this above 1 enables multi-main (`N8N_MULTI_MAIN_SETUP_ENABLED`): all main instances must share the same
  #    database, encryption key and Redis, and n8n needs a queue backend (`worker.mode: queue`) plus an Enterprise licence
  #    upstream for the extra replicas to take over scheduling. With a Community licence they cannot schedule executions.
  count: 1

  # -- Editor based URL. If it's not defined and ingress definition exists, ingress host will be used.
  editorBaseUrl: ""

  # -- Whether to enable the PodDisruptionBudget for the main pod.
  pdb:
    # -- Whether to enable the PodDisruptionBudget
    enabled: true
    # -- Minimum number of available replicas
    minAvailable: null
    # -- Maximum number of unavailable replicas
    maxUnavailable: 1
    # -- Unhealty main pod eviction policy
    unhealthyPodEvictionPolicy: AlwaysAllow

  # -- This block is for setting up the resource management for the main pod more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 2000m
  #   memory: 1Gi

  # -- This is to setup the liveness probe for the main pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /healthz
      port: http

  # -- This is to setup the readiness probe for the main pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    httpGet:
      path: /healthz/readiness
      port: http

  # -- Force to use statefulset for the main pod. If true, the main pod will be created as a statefulset.
  forceToUseStatefulset: false

  # -- Persistence configuration for the main pod
  persistence:
    # -- Whether to enable persistence
    enabled: false
    # -- Name of the volume to use for persistence
    volumeName: ""
    # -- Existing claim to use for persistence
    existingClaim: ""
    # -- Mount path for persistence
    mountPath: "/home/node/.n8n"
    # -- Sub path for persistence
    subPath: ""
    # -- Storage class for persistence
    storageClass: ""
    # -- Access mode for persistence
    accessMode: ReadWriteOnce
    # -- Size for persistence
    size: 8Gi
    # -- Annotations for persistence
    annotations:
      helm.sh/resource-policy: keep
    # -- Labels for persistence
    labels: {}

  # -- Extra environment variables
  extraEnvVars: {}

  # -- Extra environment variables that support `valueFrom` (e.g., secretKeyRef, configMapKeyRef). Entries are passed through verbatim and rendered after `extraEnvVars`.
  extraEnv: []
  # - name: MY_ENV
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: my-key

  # -- Extra secrets for environment variables
  extraSecretNamesForEnvFrom: []

  # -- Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Additional init containers for the main pod
  initContainers: []

  # -- Additional containers for the main pod
  extraContainers: []

  # -- Main node affinity. For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Host aliases for the main pod. For more information checkout: https://kubernetes.io/docs/tasks/network/customize-hosts-file-for-pods/#adding-additional-entries-with-hostaliases
  hostAliases: []

  # -- Runtime class name for the main pod. For more information checkout: https://kubernetes.io/docs/concepts/containers/runtime-class/
  runtimeClassName: ""

# -- Worker node configurations
worker:
  # -- Use `regular` to use main node as executer, or use `queue` to have worker nodes
  mode: regular

  # -- number of concurrency for each worker
  concurrency: 10

  # -- Static number of workers. If allNodes or autoscaling is enabled, this value will be ignored.
  count: 2

  # -- If true, all k8s nodes will deploy exatly one worker pod
  allNodes: false

  # -- If true, the number of workers will be automatically scaled based on default metrics. On default, it will scale based on CPU and memory. For more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    # -- Whether autoscaling is enabled.
    enabled: false

    # -- The minimum number of replicas.
    minReplicas: 2

    # -- The maximum number of replicas.
    maxReplicas: 10

    # -- The metrics to use for autoscaling.
    metrics:
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 80
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

    # -- The behavior of the autoscaler.
    behavior: {}
      # scaleDown:
      #   stabilizationWindowSeconds: 300
      #   policies:
      #   - type: Percent
      #     value: 100
      #     periodSeconds: 15
      # scaleUp:
      #   stabilizationWindowSeconds: 0
      #   policies:
      #   - type: Percent
      #     value: 100
      #     periodSeconds: 15
      #   - type: Pods
      #     value: 4
      #     periodSeconds: 15
      #   selectPolicy: Max

  # -- Whether to enable the PodDisruptionBudget for the worker pod
  pdb:
    # -- Whether to enable the PodDisruptionBudget
    enabled: true
    # -- Minimum number of available replicas
    minAvailable: null
    # -- Maximum number of unavailable replicas
    maxUnavailable: 1
    # -- Unhealty worker pod eviction policy
    unhealthyPodEvictionPolicy: AlwaysAllow

  # -- This is to setup the wait for the main node to be ready.
  waitMainNodeReady:
    # -- Whether to enable the wait for the main node to be ready.
    enabled: false
    # -- The schema to use for request to the main node. On default, it will use identify the schema from the main N8N_PROTOCOL environment variable or use http.
    overwriteSchema: ""
    # -- The URL to use for request to the main node. On default, it will use service name and port.
    overwriteUrl: ""
    # -- The health check path to use for request to the main node.
    healthCheckPath: "/healthz"
    # -- The additional parameters to use part of wget command. e.g. --no-check-certificate
    additionalParameters: []
      # - "--no-check-certificate"

  # -- This block is for setting up the resource management for the worker pod more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 2000m
  #   memory: 1Gi

  # -- This is to setup the startup probe for the worker pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  startupProbe:
    exec:
      command: ["/bin/sh", "-c", "ps aux | grep '[n]8n'"]
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30

  # -- This is to setup the liveness probe for the worker pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /healthz
      port: http

  # -- This is to setup the readiness probe for the worker pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    httpGet:
      path: /healthz/readiness
      port: http

  # -- Force to use statefulset for the worker pod. If true, the worker pod will be created as a statefulset.
  forceToUseStatefulset: false

  # -- Persistence configuration for the worker pod
  persistence:
    # -- Whether to enable persistence
    enabled: false
    # -- Name of the volume to use for persistence
    volumeName: ""
    # -- Existing claim to use for persistence
    existingClaim: ""
    # -- Mount path for persistence
    mountPath: "/home/node/.n8n"
    # -- Sub path for persistence
    subPath: ""
    # -- Storage class for persistence
    storageClass: ""
    # -- Access mode for persistence
    accessMode: ReadWriteOnce
    # -- Size for persistence
    size: 8Gi
    # -- Annotations for persistence
    annotations:
      helm.sh/resource-policy: keep
    # -- Labels for persistence
    labels: {}

  # -- Extra environment variables
  extraEnvVars: {}

  # -- Extra environment variables that support `valueFrom` (e.g., secretKeyRef, configMapKeyRef). Entries are passed through verbatim and rendered after `extraEnvVars`.
  extraEnv: []
  # - name: MY_ENV
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: my-key

  # -- Extra secrets for environment variables
  extraSecretNamesForEnvFrom: []

  # -- Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Additional init containers for the worker pod
  initContainers: []

  # -- Additional containers for the worker pod
  extraContainers: []

  # -- Worker node affinity. For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Host aliases for the worker pod. For more information checkout: https://kubernetes.io/docs/tasks/network/customize-hosts-file-for-pods/#adding-additional-entries-with-hostaliases
  hostAliases: []

  # -- Runtime class name for the worker pod. For more information checkout: https://kubernetes.io/docs/concepts/containers/runtime-class/
  runtimeClassName: ""

# -- Webhook node configurations
webhook:
  # -- Use `regular` to use main node as webhook node, or use `queue` to have webhook nodes
  mode: regular

  # -- Webhook url together with http or https schema
  url: ""

  # -- Static number of webhooks. If allNodes or autoscaling is enabled, this value will be ignored.
  count: 2

  # -- If true, all k8s nodes will deploy exatly one webhook pod
  allNodes: false

  # -- MCP webhook configuration. This is only used when the webhook mode is set to `queue` and the database type is set to `postgresdb`.
  mcp:
    # -- Whether to enable MCP webhook
    enabled: true

    # -- This block is for setting up the resource management for the mcp webhook pod more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    resources: {}

    # -- This is to setup the startup probe for the mcp webhook pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    startupProbe:
      exec:
        command: ["/bin/sh", "-c", "ps aux | grep '[n]8n'"]
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30

    # -- This is to setup the liveness probe for the mcp webhook pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    livenessProbe:
      httpGet:
        path: /healthz
        port: http

    # -- This is to setup the readiness probe for the mcp webhook pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    readinessProbe:
      httpGet:
        path: /healthz/readiness
        port: http

    # -- Extra environment variables for the mcp webhook pod
    extraEnvVars: {}

    # -- Extra environment variables for the mcp webhook pod that support `valueFrom` (e.g., secretKeyRef, configMapKeyRef). Entries are passed through verbatim and rendered after `extraEnvVars`.
    extraEnv: []
    # - name: MY_ENV
    #   valueFrom:
    #     secretKeyRef:
    #       name: my-secret
    #       key: my-key

    # -- Extra secrets for environment variables for the mcp webhook pod
    extraSecretNamesForEnvFrom: []

    # -- Additional volumes on the output Deployment definition for the mcp webhook pod
    volumes: []
    # - name: foo
    #   secret:
    #     secretName: mysecret
    #     optional: false

    # -- Additional volumeMounts on the output Deployment definition for the mcp webhook pod
    volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true

    # -- Additional init containers for the mcp webhook pod
    initContainers: []

    # -- Additional containers for the mcp webhook pod
    extraContainers: []

    # -- Webhook node affinity for the mcp webhook pod. For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
    affinity: {}

    # -- Host aliases for the mcp webhook pod. For more information checkout: https://kubernetes.io/docs/tasks/network/customize-hosts-file-for-pods/#adding-additional-entries-with-hostaliases
    hostAliases: []

  # -- If true, the number of webhooks will be automatically scaled based on default metrics. On default, it will scale based on CPU. Scale by requests can be done by setting a custom metric. For more information can be found here: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/
  autoscaling:
    # -- Whether autoscaling is enabled.
    enabled: false

    # -- The minimum number of replicas.
    minReplicas: 2

    # -- The maximum number of replicas.
    maxReplicas: 10

    # -- The metrics to use for autoscaling.
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
      # - type: Pods
      #   pods:
      #     metric:
      #       name: packets-per-second
      #     target:
      #       type: AverageValue
      #       averageValue: 1k
      # - type: Object
      #   object:
      #     metric:
      #       name: requests-per-second
      #     describedObject:
      #       apiVersion: networking.k8s.io/v1
      #       kind: Ingress
      #       name: main-route
      #     target:
      #       type: Value
      #       value: 10k

    # -- The behavior of the autoscaler.
    behavior: {}
      # scaleDown:
      #   stabilizationWindowSeconds: 300
      #   policies:
      #   - type: Percent
      #     value: 100
      #     periodSeconds: 15
      # scaleUp:
      #   stabilizationWindowSeconds: 0
      #   policies:
      #   - type: Percent
      #     value: 100
      #     periodSeconds: 15
      #   - type: Pods
      #     value: 4
      #     periodSeconds: 15
      #   selectPolicy: Max

  # -- Whether to enable the PodDisruptionBudget for the webhook pod
  pdb:
    # -- Whether to enable the PodDisruptionBudget
    enabled: true
    # -- Minimum number of available replicas
    minAvailable: null
    # -- Maximum number of unavailable replicas
    maxUnavailable: 1
    # -- Unhealty webhook pod eviction policy
    unhealthyPodEvictionPolicy: AlwaysAllow

  # -- This is to setup the wait for the webhook node to be ready.
  waitMainNodeReady:
    # -- Whether to enable the wait for the webhook node to be ready.
    enabled: false
    # -- The schema to use for request to the main node. On default, it will use identify the schema from the main N8N_PROTOCOL environment variable or use http.
    overwriteSchema: ""
    # -- The URL to use for request to the main node. On default, it will use service name and port.
    overwriteUrl: ""
    # -- The health check path to use for request to the main node.
    healthCheckPath: "/healthz"
    # -- The additional parameters to use part of wget command. e.g. --no-check-certificate
    additionalParameters: []
      # - "--no-check-certificate"

  # -- This block is for setting up the resource management for the webhook pod more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 2000m
  #   memory: 1Gi

  # -- This is to setup the startup probe for the webhook pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  startupProbe:
    exec:
      command: ["/bin/sh", "-c", "ps aux | grep '[n]8n'"]
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30

  # -- This is to setup the liveness probe for the webhook pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /healthz
      port: http

  # -- This is to setup the readiness probe for the webhook pod more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    httpGet:
      path: /healthz/readiness
      port: http

  # -- Extra environment variables
  extraEnvVars: {}

  # -- Extra environment variables that support `valueFrom` (e.g., secretKeyRef, configMapKeyRef). Entries are passed through verbatim and rendered after `extraEnvVars`.
  extraEnv: []
  # - name: MY_ENV
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: my-key

  # -- Extra secrets for environment variables
  extraSecretNamesForEnvFrom: []

  # -- Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Additional init containers for the webhook pod
  initContainers: []

  # -- Additional containers for the webhook pod
  extraContainers: []

  # -- Webhook node affinity. For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Host aliases for the webhook pod. For more information checkout: https://kubernetes.io/docs/tasks/network/customize-hosts-file-for-pods/#adding-additional-entries-with-hostaliases
  hostAliases: []

  # -- Runtime class name for the webhook pod. For more information checkout: https://kubernetes.io/docs/concepts/containers/runtime-class/
  runtimeClassName: ""

# -- Task runners mode. Please follow the documentation for more information: https://docs.n8n.io/hosting/configuration/task-runners/
taskRunners:
  # -- Use `internal` to use internal task runner, or use `external` to have external sidecar task runner. For more information please follow the documentation: https://docs.n8n.io/hosting/configuration/task-runners/#task-runner-modes
  mode: internal
  # -- The timeout for the task in seconds
  taskTimeout: 60
  # -- The heartbeat interval for the task in seconds
  taskHeartbeatInterval: 30
  # -- The maximum concurrency for the task
  maxConcurrency: 5

  # -- The address for the broker of the external task runner
  broker:
    # -- The address for the broker of the external task runner
    address: "127.0.0.1"
    # -- The port for the broker of the external task runner
    port: 5679

  # -- The configuration for the external task runner
  external:
    # -- The auth token for the main node
    mainNodeAuthToken: ""
    # -- The auth token for the worker node
    workerNodeAuthToken: ""
    # -- The auto shutdown timeout for the external task runner in seconds
    autoShutdownTimeout: 15
    # -- The port for the external task runner
    port: 5680
    # -- The node options for the external task runner
    nodeOptions:
      - "--max-semi-space-size=16"
      - "--max-old-space-size=300"

    # -- The image for the external task runner sidecar. Tag must match the n8n appVersion.
    image:
      # -- The repository for the external task runner image
      repository: n8nio/runners
      # -- This sets the pull policy for images.
      pullPolicy: IfNotPresent
      # -- Overrides the image tag whose default is the chart appVersion.
      tag: ""

    # -- The resources for the external task runner
    resources:
      # -- The resources requests for the external task runner
      requests:
        # -- The CPU request for the external task runner
        cpu: 100m
        # -- The memory request for the external task runner
        memory: 32Mi
      # -- The limits for the external task runner
      limits:
        # -- The CPU limit for the external task runner
        cpu: 2000m
        # -- The memory limit for the external task runner
        memory: 512Mi

    # -- Path to the Python venv's site-packages directory inside the `n8nio/runners` image. Used to mount a `.pth` file that exposes packages installed by `nodes.python.external.packages` to the Python runner, which always runs with `-I` (isolated mode) and therefore ignores `PYTHONPATH`. Update this if the image's bundled Python minor version changes.
    pythonSitePackagesDir: /opt/runners/task-runner-python/.venv/lib/python3.13/site-packages

# -- The workflow history configuration
workflowHistory:
  # -- Whether to save workflow history versions
  enabled: true
  # -- Time (in hours) to keep workflow history versions for. To disable it, use -1 as a value
  pruneTime: 336

# -- If you install n8n first time, you can keep this empty and it will be auto generated and never change again. If you already have a encryption key generated before, please use it here.
encryptionKey: ""

# -- The name of an existing secret with encryption key. The secret must contain a key with the name N8N_ENCRYPTION_KEY.
existingEncryptionKeySecret: ""

# -- Encryption key rotation (`N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION`). n8n 3.0 enables this by default.
#   WARNING: this is a one-way migration. The first instance to start with it enabled rewrites all encrypted data in a new format.
#   Once rewritten, running with rotation disabled makes that data permanently unreadable and there is no way back.
#   Every main and worker instance must share the same `encryptionKey` at all times, including during the migration.
#   Back up the database before enabling this. The chart leaves it `false` so that upgrading the chart cannot silently start an
#   irreversible migration; set it to `true` deliberately once the backup exists.
encryptionKeyRotation:
  # -- Enable encryption key rotation. One-way; see the warning above.
  enabled: false

# -- Instance security defaults introduced by n8n 2.0, rendered into a ConfigMap consumed by every n8n container.
security:
  # -- Enforce `0600` permissions on n8n configuration files (`N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS`). Strict enforcement is the default from n8n 2.0 onwards; set to `false` only if a mounted file legitimately needs wider permissions.
  enforceSettingsFilePermissions: true
  # -- Block environment variable access from within nodes (`N8N_BLOCK_ENV_ACCESS_IN_NODE`). n8n 2.0 defaults this to `true`; set to `false` only when workflows rely on reading `$env`, which exposes every secret in the container to anyone who can edit a Code node.
  blockEnvAccessInNode: true
  # -- Directories the `ReadWriteFile` and `ReadBinaryFiles` nodes may access (`N8N_RESTRICT_FILE_ACCESS_TO`), as a semicolon-separated list. Leave unset (`~`) to inherit the n8n default, which is `~/.n8n-files` from n8n 2.0 onwards. Set it explicitly to widen or narrow the allowed paths; set it to `""` to disable the restriction entirely (insecure - the whole filesystem becomes reachable from file nodes).
  restrictFileAccessTo: ~
  # -- Forbid bare Git repositories in the Git node (`N8N_GIT_NODE_DISABLE_BARE_REPOS`). n8n 2.0 defaults this to `true`; set to `false` only when a workflow needs to read a bare repository from a shared volume.
  gitNodeDisableBareRepos: true

# -- For instance, the Schedule node uses it to know at what time the workflow should start. Find you timezone from here: https://momentjs.com/timezone/
timezone: "Europe/Berlin"

# -- A locale identifier, compatible with the Accept-Language header. n8n doesn't support regional identifiers, such as de-AT.
defaultLocale: en

# -- graceful shutdown timeout in seconds
gracefulShutdownTimeout: 30

# -- This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: n8n.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: n8n-tls
  #    hosts:
  #      - n8n.local

# -- The service monitor configuration. Please refer to the following link for more information: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md
serviceMonitor:
  # -- When set true then use a ServiceMonitor to configure scraping
  enabled: false
  # -- Set the namespace the ServiceMonitor should be deployed. If empty, the ServiceMonitor will be deployed in the same namespace as the n8n chart.
  namespace: ""
  # -- Set how frequently Prometheus should scrape
  interval: 30s
  # -- Set labels for the ServiceMonitor, use this to define your scrape label for Prometheus Operator
  labels:
    # -- default `kube prometheus stack` helm chart serviceMonitor selector label
    # Mostly it's your prometheus helm release name. Please find more information from here:
    # https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/troubleshooting.md#troubleshooting-servicemonitor-changes
    release: prometheus
  # -- Set timeout for scrape
  timeout: 10s
  # -- Set of labels to transfer on the Kubernetes Service onto the target.
  targetLabels: []

  # -- Set of rules to relabel your exist metric labels
  metricRelabelings: []
    # - sourceLabels: [prometheus_replica]
    #   regex: (.*)
    #   targetLabel: another_prometheus_replica
    #   action: replace
    # - regex: prometheus_replica
    #   action: labeldrop

  # -- The prefix for the metrics
  metricsPrefix: "n8n_"

  # -- Whether to include metrics
  include:
    # -- Whether to include default metrics
    defaultMetrics: true
    # -- Whether to include cache metrics
    cacheMetrics: false
    # -- Whether to include message event bus metrics
    messageEventBusMetrics: false
    # -- Whether to include workflow id label
    workflowIdLabel: false
    # -- Whether to include node type label
    nodeTypeLabel: false
    # -- Whether to include credential type label
    credentialTypeLabel: false
    # -- Whether to include api endpoints
    apiEndpoints: false
    # -- Whether to include api path label
    apiPathLabel: false
    # -- Whether to include api method label
    apiMethodLabel: false
    # -- Whether to include api status code label
    apiStatusCodeLabel: false
    # -- Whether to include queue metrics
    queueMetrics: false






# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector: {}

# -- For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []


# -- For more information checkout: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
dnsPolicy: ""

# -- For more information checkout: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig: {}

# -- External Redis parameters
externalRedis:
  # -- Redis database for Bull queue.
  database: 0
  # -- External Redis server host
  host: ""
  # -- External Redis username
  username: ""
  # -- External Redis password
  password: ""
  # -- External Redis server port
  port: 6379
  # -- The name of an existing secret with Redis (must contain key `redis-password`) and Sentinel credentials.
  # When it's set, the `externalRedis.password` parameter is ignored
  existingSecret: ""
  # -- The key in `externalRedis.existingSecret` that stores the Redis username.
  existingUsernameKey: ""
  # -- The key in `externalRedis.existingSecret` that stores the Redis password.
  existingPasswordKey: ""
  # -- List of Redis Cluster nodes. Setting this variable will create a Redis Cluster client instead of a Redis client, and n8n will ignore `externalRedis.host` and `externalRedis.port`.
  clusterNodes: []
    # - host: redis-1
    #   port: 6379
    # - host: redis-2
    #   port: 6379
  # -- Placeholder for future Redis TLS certificates
  tls:
    # -- Enable TLS on Redis connections.
    enabled: false
  # -- Enable dual-stack support (IPv4 and IPv6) on Redis connections.
  dualStack: false

# -- External PostgreSQL parameters
externalPostgresql:
  # -- External PostgreSQL server host
  host: ""
  # -- External PostgreSQL username
  username: "postgres"
  # -- External PostgreSQL password
  password: ""
  # -- External PostgreSQL server port
  port: 5432
  # -- The name of the external PostgreSQL database. For more information: https://docs.n8n.io/hosting/configuration/supported-databases-settings/#required-permissions
  database: n8n
  # -- The name of an existing secret with PostgreSQL (must contain key `postgres-password`) and credentials.
  # When it's set, the `externalPostgresql.password` parameter is ignored
  existingSecret: ""
  # -- The key in `externalPostgresql.existingSecret` that stores the PostgreSQL password.
  existingSecretPasswordKey: ""

# -- List of extra Kubernetes manifests (objects or YAML strings) to deploy alongside n8n. Chart labels are automatically merged into each manifest's metadata.
extraManifests: []

# -- List of extra Kubernetes manifests as Helm template strings to deploy alongside n8n. Chart labels are automatically merged into each manifest's metadata.
extraTemplateManifests: []

# -- Execution lifecycle and request-size limits, rendered into the operations ConfigMap consumed by every n8n container.
operations:
  # -- Default workflow timeout in seconds (`EXECUTIONS_TIMEOUT`). `-1` disables it. Users can override per workflow up to `timeoutMax`.
  timeout: -1
  # -- Maximum timeout in seconds a user may set on a single workflow (`EXECUTIONS_TIMEOUT_MAX`).
  timeoutMax: 3600
  # -- Save execution data on error (`EXECUTIONS_DATA_SAVE_ON_ERROR`).
  saveDataOnError: all
  # -- Save execution data on success (`EXECUTIONS_DATA_SAVE_ON_SUCCESS`). Setting this to `none` is the single most effective way to slow database growth, but it removes the ability to inspect or retry successful runs.
  saveDataOnSuccess: all
  # -- Save progress for every executed node (`EXECUTIONS_DATA_SAVE_ON_PROGRESS`). Increases write volume substantially; only enable while debugging.
  saveDataOnProgress: false
  # -- Save data for manually triggered executions (`EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS`).
  saveDataManualExecutions: true
  # -- Delete old execution data on a rolling basis (`EXECUTIONS_DATA_PRUNE`). Off by upstream default; leaving it `false` lets the database grow without bound.
  pruneData: false
  # -- Execution age in hours before deletion (`EXECUTIONS_DATA_MAX_AGE`). Only used when `pruneData` is `true`.
  pruneDataMaxAge: 336
  # -- Maximum number of executions to keep (`EXECUTIONS_DATA_PRUNE_MAX_COUNT`). `0` means no limit. Only used when `pruneData` is `true`.
  pruneDataMaxCount: 10000
  # -- Age in hours after which finished execution data is hard-deleted (`EXECUTIONS_DATA_HARD_DELETE_BUFFER`).
  pruneDataHardDeleteBuffer: 1
  # -- Maximum request payload size in MB for webhooks and the REST API (`N8N_PAYLOAD_SIZE_MAX`).
  payloadSizeMax: 16
  # -- Maximum uploaded file size in MB for form submissions (`N8N_FORMDATA_FILE_SIZE_MAX`).
  formDataFileSizeMax: 200
  # -- Maximum size in bytes of execution data loaded when displaying an execution (`EXECUTIONS_DATA_MAX_DISPLAY_SIZE`). Larger executions are shown as "too large to display". `0` disables the limit.
  maxDisplaySize: 104857600

# -- SSRF protection for outbound requests from user-controllable nodes. Available from n8n 2.12; not license-gated. This is application-level defence-in-depth and does not replace network policy.
ssrfProtection:
  # -- Enable SSRF validation of outbound HTTP requests (`N8N_SSRF_PROTECTION_ENABLED`). Enabling it blocks RFC1918, loopback and link-local ranges by default, so internal services stop being reachable until allowlisted below.
  enabled: false
  # -- Hostname patterns allowed to bypass the blocklist (`N8N_SSRF_ALLOWED_HOSTNAMES`), supports wildcards such as `*.n8n.internal`. Takes precedence over the IP allowlist.
  allowedHostnames: []
  # -- CIDR ranges allowed to bypass the blocklist (`N8N_SSRF_ALLOWED_IP_RANGES`). Takes precedence over `blockedIpRanges`.
  allowedIpRanges: []
  # -- Additional CIDR ranges to block on top of the upstream defaults (`N8N_SSRF_BLOCKED_IP_RANGES`). Include the literal string `default` to keep the upstream list alongside your own.
  blockedIpRanges: []
  # -- Hostnames that are always blocked (`N8N_SSRF_BLOCKED_HOSTNAMES`).
  blockedHostnames: []
  # -- Maximum DNS cache entries (`N8N_SSRF_DNS_CACHE_MAX_SIZE`).
  dnsCacheMaxSize: 1048576

# -- Durable, database-backed scheduler for time-based workflows. Available from n8n 2.36 (Preview from 2.32). Requires `operations`-independent Postgres or SQLite; runs on main instances.
durableScheduler:
  # -- Take over Schedule Trigger nodes (`N8N_SCHEDULER_ENABLED`). Setting this to `true` also enables the workflow publication service, which n8n requires for the scheduler to take effect - enabling one without the other is a silent no-op.
  enabled: false
  # -- Also take over poll triggers such as Google Sheets Trigger (`N8N_SCHEDULER_POLL_TRIGGERS_ENABLED`). Upstream warns this is not yet fully stable; keep it off in production. Requires `enabled`.
  pollTriggers: false
  # -- Store each poll's cursor transactionally so a crash mid-poll cannot drop or duplicate data (`N8N_POLLER_DURABLE_CURSORS_ENABLED`). Requires `enabled` and `pollTriggers`.
  durableCursors: false
  # -- Show a per-node "Skip Durable Scheduler" option to keep individual triggers on the in-memory scheduler (`N8N_ENV_FEAT_SKIP_DURABLE_SCHEDULER`). Temporary upstream escape hatch.
  allowSkip: false

# -- Outbound email via SMTP. Without this, n8n cannot send invitations, password resets or shared-workflow notifications.
smtp:
  # -- Enable SMTP (`N8N_EMAIL_MODE`). Set to `smtp`; leave `false` to disable outbound email entirely.
  enabled: false
  # -- SMTP host (`N8N_SMTP_HOST`).
  host: ""
  # -- SMTP port (`N8N_SMTP_PORT`). `465` is implicit TLS, `587` is STARTTLS.
  port: 465
  # -- Username for SMTP auth (`N8N_SMTP_USER`).
  user: ""
  # -- Sender address (`N8N_SMTP_SENDER`).
  sender: ""
  # -- Use implicit TLS (`N8N_SMTP_SSL`). Keep `true` for port 465, set `false` with `startTls: true` for 587.
  ssl: true
  # -- Upgrade to TLS with STARTTLS (`N8N_SMTP_STARTTLS`).
  startTls: true
  # -- Existing secret holding the SMTP password. The chart reads the key named in `passwordKey` and exposes it as `N8N_SMTP_PASS`. Takes precedence over `password`.
  existingSecret: ""
  # -- Key inside `existingSecret` that holds the password.
  passwordKey: password
  # -- SMTP password written into the chart-managed Secret. Ignored when `existingSecret` is set. Prefer `existingSecret` so the value stays out of your values file.
  password: ""

# -- Bootstrap and pin the instance owner from the environment, for GitOps installations where nobody should have to complete a first-run form.
instanceOwner:
  # -- Manage the instance owner from environment variables (`N8N_INSTANCE_OWNER_MANAGED_BY_ENV`). While `true` n8n overwrites the owner details on every startup, locks those fields in the UI and rejects API writes.
  enabled: false
  # -- Owner email address (`N8N_INSTANCE_OWNER_EMAIL`). Must not already belong to another user on the instance.
  email: ""
  # -- Owner first name (`N8N_INSTANCE_OWNER_FIRST_NAME`).
  firstName: ""
  # -- Owner last name (`N8N_INSTANCE_OWNER_LAST_NAME`).
  lastName: ""
  # -- Bcrypt hash of the owner password, written into the chart-managed Secret as `N8N_INSTANCE_OWNER_PASSWORD_HASH`. Ignored when `existingSecret` is set. Generate one with `npx bcrypt '<password>'`; a plaintext value here breaks login and commits a credential.
  passwordHash: ""
  # -- Existing secret holding a bcrypt hash of the owner password, exposed as `N8N_INSTANCE_OWNER_PASSWORD_HASH`. The value must be a bcrypt hash; a plaintext password breaks login.
  existingSecret: ""
  # -- Key inside `existingSecret` that holds the bcrypt hash.
  passwordHashKey: password-hash

# -- n8n Assistant and agents (`instance-ai`, `agents`). Preview feature; available on self-hosted Community, Registered Community and Business, not self-hosted Enterprise. Requires a sandbox; see `sandboxService`.
aiAssistant:
  # -- Enable the AI module surface and render its ConfigMap. Does not by itself pick modules; see `modules`.
  enabled: false
  # -- Modules to load via `N8N_ENABLED_MODULES`, for example `["instance-ai", "agents"]`. `agents` can be run without `instance-ai`; keep both for AI-assisted agent building.
  modules:
    - instance-ai
  # -- Model in `provider/model` form (`N8N_INSTANCE_AI_MODEL`). Supported providers: `anthropic`, `openai`, `openrouter`.
  model: anthropic/claude-opus-4-8
  # -- OpenAI-compatible endpoint for a local or custom model server (`N8N_INSTANCE_AI_MODEL_URL`). Leave empty to use the provider's hosted API.
  modelUrl: ""
  # -- Existing secret holding the model API key, exposed as `N8N_INSTANCE_AI_MODEL_API_KEY`. When empty, n8n falls back to the provider's own environment variable and to in-UI configuration.
  existingModelApiKeySecret: ""
  # -- Key inside `existingModelApiKeySecret` that holds the API key.
  modelApiKeyKey: api-key
  # -- Model API key written into the chart-managed Secret as `N8N_INSTANCE_AI_MODEL_API_KEY`. Ignored when `existingModelApiKeySecret` is set. Prefer `existingModelApiKeySecret` so the key stays out of your values file.
  modelApiKey: ""
  # -- MCP servers the assistant may use (`N8N_INSTANCE_AI_MCP_SERVERS`), as a JSON string.
  mcpServers: ""
  # -- Sandbox used to run AI-generated code. Required for n8n Assistant.
  sandbox:
    # -- Point n8n at a sandbox service (`N8N_INSTANCE_AI_SANDBOX_ENABLED`).
    enabled: false
    # -- Sandbox provider (`N8N_INSTANCE_AI_SANDBOX_PROVIDER`). The chart supports `n8n-sandbox`; use `external` when the service runs outside this cluster.
    provider: n8n-sandbox
    # -- Sandbox API URL (`N8N_SANDBOX_SERVICE_URL`). Defaults to the in-cluster `sandboxService` URL when it is enabled; set it explicitly for an external service.
    serviceUrl: ""
    # -- Existing secret holding the sandbox API key, exposed as `N8N_SANDBOX_SERVICE_API_KEY`. Must match a value in the sandbox service's `SANDBOX_API_KEYS`. When empty and `sandboxService.enabled` is `true`, the chart reuses that service's generated key.
    existingApiKeySecret: ""
    # -- Key inside `existingApiKeySecret` that holds the API key.
    apiKeyKey: api-key
  # -- Web search backend for the assistant.
  searxng:
    # -- SearXNG base URL (`N8N_INSTANCE_AI_SEARXNG_URL`) of an externally managed SearXNG instance. Must include a scheme (http:// or https://).
    url: ""

# -- The n8n Sandbox Service: a control-plane API plus an in-cluster runner that executes AI-generated code. Deployed only when `sandboxService.enabled`. Treat the runner as root-equivalent on its node.
sandboxService:
  # -- Deploy the sandbox API and runner pods.
  enabled: false
  # -- Number of API replicas. Keep `1` unless `api.store` is `postgres`; the default SQLite store cannot be shared between replicas.
  replicas: 1
  image:
    # -- Sandbox service API image repository.
    repository: ghcr.io/n8n-io/n8n-sandbox-service-api
    # -- Image tag. Defaults to the pinned version below when empty.
    tag: ""
    # -- Overrides the pinned service version used as the default image tag. The API, runner and sandbox images are released together and must match.
    version: 1.3.4
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Sandbox runner image repository (Docker-in-Docker build).
    runnerRepository: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind
    # -- Sandbox image used for the per-execution sandbox containers created by the runner.
    sandboxRepository: ghcr.io/n8n-io/n8n-sandbox-service-sandbox
  # -- Authentication material. The API key handed to n8n must be one of `apiKeys`.
  auth:
    # -- Existing secret supplying the sandbox credentials instead of generated ones. Expected keys are configurable below.
    existingSecret: ""
    # -- Comma-separated admin API keys accepted by the API (`SANDBOX_API_KEYS`). Required unless `existingSecret` is set. Generate a long random value; do not commit a real key.
    apiKeys: ""
    # -- Shared secret runners use to register with the API (`SANDBOX_API_RUNNER_REGISTRATION_TOKEN`). Must match the runner. Required unless `existingSecret` is set.
    runnerRegistrationToken: ""
    # -- Key the API uses when calling the runner (`SANDBOX_API_RUNNER_API_KEY`). Required unless `existingSecret` is set.
    runnerApiKey: ""
    # -- Comma-separated keys the runner accepts from the API (`SANDBOX_RUNNER_API_KEYS`). Must include `runnerApiKey`. Required unless `existingSecret` is set.
    runnerApiKeys: ""
    # -- Key names inside the auth secret.
    keys:
      # -- Key holding `SANDBOX_API_KEYS`.
      apiKeys: api-keys
      # -- Key holding `SANDBOX_API_RUNNER_REGISTRATION_TOKEN`.
      runnerRegistrationToken: runner-registration-token
      # -- Key holding `SANDBOX_API_RUNNER_API_KEY`.
      runnerApiKey: runner-api-key
      # -- Key holding `SANDBOX_RUNNER_API_KEYS`.
      runnerApiKeys: runner-api-keys
  # -- Mutual TLS between the API and the runner. Both peers require certificates; the stack does not run without them.
  tls:
    # -- How certificate Secrets are supplied: `existingSecret` (you provide them) or `certManager` (cert-manager issues them).
    mode: existingSecret
    # -- cert-manager issuer used when `mode` is `certManager`.
    certManager:
      # -- Issuer or ClusterIssuer name. Required when `mode` is `certManager`.
      issuerRef:
        name: ""
        # -- Kind of the issuer reference.
        kind: Issuer
        # -- API group of the issuer reference.
        group: cert-manager.io
      # -- Certificate lifetime (`duration`) and renewal lead time (`renewBefore`), in Go duration format.
      duration: 2160h
      renewBefore: 360h
    # -- The four certificates the stack needs. Each is a kubernetes.io/tls Secret containing `tls.crt`, `tls.key` and `ca.crt`.
    certificates:
      # -- Server certificate presented by the API's registration gRPC listener. DNS names are generated from the API service name.
      apiRegistrationServer:
        secretName: ""
        mountPath: /tls/api-registration
      # -- Client certificate the API uses against the runner's control listener.
      apiControlClient:
        secretName: ""
        mountPath: /tls/api-control-client
      # -- Client certificate the runner uses when registering with the API.
      runnerRegistrationClient:
        secretName: ""
        mountPath: /tls/runner-registration
      # -- Server certificate for the runner's control gRPC and HTTPS listeners. Its SANs must match the runner host in `httpBaseUrl`.
      runnerControlServer:
        secretName: ""
        mountPath: /tls/runner-control
  api:
    # -- Store backend: `sqlite` for a single API pod, `postgres` when running more than one replica.
    store: sqlite
    # -- Default per-tenant sandbox quota (`SANDBOX_API_DEFAULT_MAX_SANDBOXES`). `0` means unlimited.
    defaultMaxSandboxes: 50
    # -- Maximum file upload size in bytes accepted by the API (`SANDBOX_API_MAX_FILE_BYTES`).
    maxFileBytes: 10485760
    # -- How long after the last heartbeat a runner still counts as eligible for placement (`SANDBOX_API_RUNNER_HEARTBEAT_GRACE`).
    runnerHeartbeatGrace: 45s
    # -- Persist the SQLite store so sandbox state survives API pod restarts. Ignored when `store` is `postgres`.
    persistence:
      enabled: true
      size: 1Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  runner:
    # -- Isolation mode for the runner. `privileged` runs Docker-in-Docker with `privileged: true`; an escape reaches the node, so it must be acknowledged explicitly.
    isolation: privileged
    # -- Explicit acceptance of the privileged DinD security trade-off. Required when `isolation` is `privileged`. The namespace also needs Pod Security Admission level `privileged`.
    acknowledgePrivileged: false
    # -- Sandbox resource defaults applied by the runner.
    defaultMemoryMb: 512
    defaultCpuPercent: 100
    defaultPidsMax: 256
    # -- Reported capacity for placement (`SANDBOX_RUNNER_CAPACITY_TOTAL`). `0` means unlimited.
    capacityTotal: 1000
    # -- Number of runner pods. Each registers itself with the API and sandboxes are placed on the least-loaded one.
    replicas: 1
    # -- Port the runner serves HTTPS on; must match its certificate SANs via `httpBaseUrl`.
    httpPort: 8080
    # -- Port for the control gRPC listener.
    controlGrpcPort: 9091
    # -- Base URL the API uses to reach this runner (`SANDBOX_RUNNER_HTTP_BASE_URL`). Defaults to the in-cluster headless service, which keeps the host stable enough for per-pod certificates only when `replicas` is 1.
    httpBaseUrl: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # -- Runtime class for the runner pod, for example a Kata Containers class so `privileged: true` applies inside a guest VM.
    runtimeClassName: ""
