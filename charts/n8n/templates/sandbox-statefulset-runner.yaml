{{- include "n8n.sandbox.validate" . -}}
{{- if .Values.sandboxService.enabled }}
{{- $runnerRegistration := .Values.sandboxService.tls.certificates.runnerRegistrationClient -}}
{{- $runnerControl := .Values.sandboxService.tls.certificates.runnerControlServer -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "n8n.sandbox-runner.fullname" . }}
  labels:
    {{- include "n8n.sandbox-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sandboxService.runner.replicas }}
  serviceName: {{ include "n8n.sandbox-runner.fullname" . }}
  selector:
    matchLabels:
      {{- include "n8n.sandbox-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/sandbox-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "n8n.sandbox-runner.labels" . | nindent 8 }}
    spec:
      containers:
        - name: runner
          image: "{{ .Values.sandboxService.image.runnerRepository }}:{{ .Values.sandboxService.image.tag | default .Values.sandboxService.image.version }}"
          imagePullPolicy: {{ .Values.sandboxService.image.pullPolicy }}
          {{- if eq .Values.sandboxService.runner.isolation "privileged" }}
          securityContext:
            privileged: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.sandboxService.runner.httpPort }}
            - name: control-grpc
              containerPort: {{ .Values.sandboxService.runner.controlGrpcPort }}
          envFrom:
            - configMapRef:
                name: {{ include "n8n.sandbox-runner.fullname" . }}-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_RUNNER_ID
              value: "$(POD_NAME)"
            - name: SANDBOX_RUNNER_API_GRPC_ADDR
              value: "{{ include "n8n.sandbox-api.fullname" . }}:9090"
            {{- if .Values.sandboxService.runner.httpBaseUrl }}
            - name: SANDBOX_RUNNER_HTTP_BASE_URL
              value: {{ .Values.sandboxService.runner.httpBaseUrl | quote }}
            {{- else }}
            - name: SANDBOX_RUNNER_HTTP_BASE_URL
              value: "https://$(POD_NAME).{{ include "n8n.sandbox-runner.fullname" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.sandboxService.runner.httpPort }}"
            {{- end }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR
              value: "$(POD_NAME).{{ include "n8n.sandbox-runner.fullname" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.sandboxService.runner.controlGrpcPort }}"
            - name: SANDBOX_RUNNER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.sandbox.authSecretName" . }}
                  key: {{ .Values.sandboxService.auth.keys.runnerApiKeys }}
            - name: SANDBOX_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.sandbox.authSecretName" . }}
                  key: {{ .Values.sandboxService.auth.keys.runnerRegistrationToken }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE
              value: {{ printf "%s/ca.crt" $runnerRegistration.mountPath | quote }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE
              value: {{ printf "%s/tls.crt" $runnerRegistration.mountPath | quote }}
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE
              value: {{ printf "%s/tls.key" $runnerRegistration.mountPath | quote }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
              value: {{ printf "%s/tls.crt" $runnerControl.mountPath | quote }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
              value: {{ printf "%s/tls.key" $runnerControl.mountPath | quote }}
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE
              value: {{ printf "%s/ca.crt" $runnerControl.mountPath | quote }}
          # The runner serves HTTPS with client-cert-optional auth; the kubelet cannot present a client certificate, so probes use plain HTTPS.
          startupProbe:
            httpGet:
              path: /livez
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              scheme: HTTPS
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.sandboxService.runner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: runner-registration-tls
              mountPath: {{ $runnerRegistration.mountPath | quote }}
              readOnly: true
            - name: runner-control-tls
              mountPath: {{ $runnerControl.mountPath | quote }}
              readOnly: true
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: runner-registration-tls
          secret:
            secretName: {{ include "n8n.sandbox.certSecretName" (dict "root" $ "cert" $runnerRegistration "suffix" "sandbox-runner-registration-tls") }}
        - name: runner-control-tls
          secret:
            secretName: {{ include "n8n.sandbox.certSecretName" (dict "root" $ "cert" $runnerControl "suffix" "sandbox-runner-control-tls") }}
        - name: docker-data
          emptyDir: {}
      {{- with .Values.sandboxService.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxService.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxService.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sandboxService.runner.runtimeClassName }}
      runtimeClassName: {{ .Values.sandboxService.runner.runtimeClassName | quote }}
      {{- end }}
{{- end }}
