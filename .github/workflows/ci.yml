name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'charts/**'

env:
  HELM_VERSION: v3.18.3
  HELM_UNITTEST_VERSION: v0.8.2
  HELM_DOCS_VERSION: v1.14.2

jobs:
  check-helm-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install helm-docs
        run: |
          VERSION="${{ env.HELM_DOCS_VERSION }}"
          VERSION_NUMBER="${VERSION#v}"
          wget -q -O /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${VERSION}/helm-docs_${VERSION_NUMBER}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo mv /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Run helm-docs
        run: helm-docs --chart-search-root=charts --template-files=README.md.gotmpl

      - name: Check for README drift
        run: |
          if ! git diff --exit-code charts/n8n/README.md; then
            echo "README.md is out of date — run helm-docs locally and commit the updated file"
            exit 1
          fi

  lint-test:
    needs: check-helm-docs

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Install helm unittest plugin
        run: |
          helm env
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct-lint.yaml --lint-conf ./.github/configs/lintconf.yaml --charts charts/n8n

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: Run chart-testing (install)
        run: |
          ct install --config ./.github/configs/ct-lint.yaml --charts charts/n8n \
            --helm-extra-set-args "--values charts/n8n/values-kind.yaml" \
            --helm-extra-args "--timeout 600s"
