name: CI

# Workflow files are in `paths` too: without them a workflow-only PR gets no checks at all, so
# Renovate has nothing to gate automerge on and a broken release workflow surfaces only at the next
# release.
on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'charts/**'
      - '.github/workflows/**'

env:
  HELM_VERSION: v3.18.3
  HELM_UNITTEST_VERSION: v0.8.2
  HELM_DOCS_VERSION: v1.14.2

# The README drift check used to live here and block the build. It cannot: charts/n8n/README.md is
# generated from values.yaml by helm-docs, and Renovate cannot run helm-docs (Mend-hosted Renovate
# only permits `git add`, `git reset` and `pwd`), so every Renovate PR touching values.yaml would
# fail it permanently and never automerge. chart-version.yml regenerates the README on main instead.
jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: Verify the runners image exists for appVersion
        run: |
          # appVersion is the tag for BOTH n8nio/n8n and n8nio/runners. Renovate tracks it against
          # n8nio/n8n, so a release that lands there first would leave anyone running
          # taskRunners.mode=external unable to pull the sidecar. Fail closed on a definitive 404;
          # only warn on other failures so a registry outage cannot block a release.
          APP=$(yq eval '.appVersion' charts/n8n/Chart.yaml)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/n8nio/runners/tags/${APP}" || echo 000)
          if [ "$code" = "404" ]; then
            echo "::error::n8nio/runners:${APP} does not exist. appVersion is the tag for both n8n images, so this chart would break every install using taskRunners.mode=external. Wait for the runners image to publish ${APP}."
            exit 1
          elif [ "$code" != "200" ]; then
            echo "::warning::Could not verify n8nio/runners:${APP} (HTTP ${code}); proceeding."
          else
            echo "n8nio/runners:${APP} exists."
          fi

      # Also validates values.schema.json against values.yaml.
      - name: helm lint
        run: helm lint charts/n8n

      - name: helm unittest
        run: helm unittest --strict --file 'unittests/**/*.yaml' charts/n8n

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0

      - name: Install into kind
        run: |
          helm install n8n charts/n8n \
            --values charts/n8n/values-kind.yaml \
            --wait --timeout 600s
          helm test n8n --timeout 300s || true
          kubectl get pods -A
