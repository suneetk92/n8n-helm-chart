name: Chart Version

# Cuts a release when Renovate lands an n8n version bump on main.
#
# The chart version moves only when `appVersion` changes. Sandbox and base-image bumps land on main
# without a release and ride along in the next n8n release, so detection compares against the last
# `v*` tag rather than the previous commit — otherwise those earlier bumps would be missing from the
# changelog.
#
# Renovate cannot do this part: its `bumpVersion` only works with the helmv3 manager, which needs
# Chart.yaml `dependencies`, and this chart has none.
#
# main's ruleset requires the lint-test check, and this job's commits are pushed straight to it. That
# works because the ruleset grants a bypass to the GitHub Actions app (integration 15368) — the same
# integration the required check itself is registered against. Without that bypass every push here is
# rejected, since the requirement is evaluated against the commit being pushed and a check run from
# another branch does not count.
#
# The bypass is deliberate rather than a shortcut: what this job commits is a version bump, changelog
# entry and generated README derived from a commit that already passed CI on its own pull request. No
# lint or unit-test steps live here, so ci.yml stays the single place the chart is validated.
#
# It dispatches the publish itself, and must: a tag pushed with GITHUB_TOKEN triggers nothing, and the
# release commit on main has no CI run of its own for the same reason, so oci-registry.yml's tag-push
# gate could never pass for it.
#
# It cannot loop: the push uses GITHUB_TOKEN, which triggers no workflow.

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/n8n/Chart.yaml'
      - 'charts/n8n/values.yaml'
      - 'charts/n8n/README.md.gotmpl'

  # Manual recovery: re-cutting a release after a failed run cannot rely on the push trigger, since
  # the files it watches are already at their final state.
  workflow_dispatch:

# Serialize releases. Two image bumps merging close together would otherwise race, and the second
# push would fail as a non-fast-forward. Queue rather than cancel: every bump deserves its release.
concurrency:
  group: chart-release
  cancel-in-progress: false

env:
  HELM_DOCS_VERSION: v1.14.2

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags, so we can diff against the last release.
          fetch-depth: 0

      - name: Decide whether to release
        id: detect
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No v* tag yet; refusing to guess a baseline. Tag a release manually first."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Comparing against $LAST_TAG"

          at_tag() { git show "${LAST_TAG}:$1" 2>/dev/null | yq eval "$2" - 2>/dev/null || echo ""; }

          APP_NOW=$(yq eval '.appVersion' charts/n8n/Chart.yaml)
          APP_TAG=$(at_tag charts/n8n/Chart.yaml '.appVersion')
          CHART_NOW=$(yq eval '.version' charts/n8n/Chart.yaml)
          CHART_TAG=$(at_tag charts/n8n/Chart.yaml '.version')

          # Only an n8n bump cuts a release.
          if [ "$APP_NOW" = "$APP_TAG" ]; then
            echo "appVersion unchanged since ${LAST_TAG} (${APP_NOW}); no release. Any other image bumps will ride along in the next n8n release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A human already bumped the chart version in this range: their release, not ours.
          if [ "$CHART_NOW" != "$CHART_TAG" ]; then
            echo "Chart version already moved to ${CHART_NOW} since ${LAST_TAG}; leaving it alone."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          SBX_NOW=$(yq eval '.sandboxService.image.version' charts/n8n/values.yaml)
          SBX_TAG=$(at_tag charts/n8n/values.yaml '.sandboxService.image.version')
          NODE_NOW=$(yq eval '.nodes.initContainer.image.tag' charts/n8n/values.yaml)
          NODE_TAG=$(at_tag charts/n8n/values.yaml '.nodes.initContainer.image.tag')
          BB_NOW=$(yq eval '.waitContainer.image.tag' charts/n8n/values.yaml)
          BB_TAG=$(at_tag charts/n8n/values.yaml '.waitContainer.image.tag')

          notes="- n8n \`${APP_TAG}\` -> \`${APP_NOW}\` (\`appVersion\`, the tag for both \`n8nio/n8n\` and \`n8nio/runners\`)."$'\n'
          [ "$SBX_NOW"  != "$SBX_TAG"  ] && notes="${notes}- Sandbox service \`${SBX_TAG}\` -> \`${SBX_NOW}\` (all three \`n8n-sandbox-service-*\` images)."$'\n'
          [ "$NODE_NOW" != "$NODE_TAG" ] && notes="${notes}- npm-install init container \`node:${NODE_TAG}\` -> \`node:${NODE_NOW}\`."$'\n'
          [ "$BB_NOW"   != "$BB_TAG"   ] && notes="${notes}- wait-for-main init container \`busybox:${BB_TAG}\` -> \`busybox:${BB_NOW}\`."$'\n'

          # Mirror the n8n bump type so the chart version says something about what moved. A major n8n
          # release maps to a chart *minor*: the chart major is reserved for breaking changes to the
          # chart's own values API, which an upstream image bump is not.
          bump=patch
          [ "$(echo "$APP_TAG" | cut -d. -f1)" != "$(echo "$APP_NOW" | cut -d. -f1)" ] && bump=minor
          [ "$(echo "$APP_TAG" | cut -d. -f2)" != "$(echo "$APP_NOW" | cut -d. -f2)" ] && bump=minor
          echo "n8n ${APP_TAG} -> ${APP_NOW} is a ${bump}-level chart bump."

          NEXT=$(echo "$CHART_NOW" | awk -F. -v b="$bump" \
            '{ if (b == "minor") printf "%d.%d.0", $1, $2+1; else printf "%d.%d.%d", $1, $2, $3+1 }')
          {
            echo "release=true"
            echo "next=$NEXT"
            echo "notes<<NOTES_EOF"
            printf '%s' "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pre-flight: the release commit is pushed without a CI run of its own, so this is the only place
      # the runners tag is checked before the version is tagged and published.
      - name: Verify the runners image exists for appVersion
        if: steps.detect.outputs.release == 'true'
        run: |
          # appVersion is the tag for BOTH n8nio/n8n and n8nio/runners, and Renovate tracks it against
          # n8nio/n8n. Fail closed on a definitive 404; only warn on other errors so a registry
          # outage cannot block a release.
          APP=$(yq eval '.appVersion' charts/n8n/Chart.yaml)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/n8nio/runners/tags/${APP}" || echo 000)
          if [ "$code" = "404" ]; then
            echo "::error::n8nio/runners:${APP} does not exist. This chart would break every install using taskRunners.mode=external."
            exit 1
          elif [ "$code" != "200" ]; then
            echo "::warning::Could not verify n8nio/runners:${APP} (HTTP ${code}); proceeding."
          else
            echo "n8nio/runners:${APP} exists."
          fi

      # Always, release or not: the README is generated from values.yaml, and Renovate cannot run
      # helm-docs itself. Doing it here keeps main's README in step with the values it documents.
      - name: Regenerate README
        run: |
          V="${{ env.HELM_DOCS_VERSION }}"
          wget -q -O /tmp/hd.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${V}/helm-docs_${V#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/hd.tar.gz -C /tmp helm-docs && sudo mv /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --chart-search-root=charts --template-files=README.md.gotmpl

      - name: Commit the regenerated README when not releasing
        if: steps.detect.outputs.release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- charts/n8n/README.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/n8n/README.md
          git commit -m "[n8n] Regenerate README for updated values"
          # Rebase first: a Renovate merge can land while this job runs, and the push must fast-forward.
          git pull --rebase --quiet origin main
          git push origin HEAD:main

      - name: Bump chart version and changelog
        if: steps.detect.outputs.release == 'true'
        env:
          NEXT: ${{ steps.detect.outputs.next }}
          NOTES: ${{ steps.detect.outputs.notes }}
        run: |
          set -euo pipefail
          yq eval -i ".version = \"${NEXT}\"" charts/n8n/Chart.yaml
          python3 - <<'EOF'
          import os, pathlib, sys
          ver, notes = os.environ["NEXT"], os.environ["NOTES"].rstrip()
          marker = "<!-- next-release -->"
          p = pathlib.Path("CHANGELOG.md")
          lines = p.read_text().splitlines(keepends=True)
          at = [i for i, line in enumerate(lines) if marker in line]
          # Anchoring on prose used to mean a reworded intro silently produced no entry, while the
          # release still tagged and published. Fail the job instead.
          if len(at) != 1:
              sys.exit(f"::error::Expected exactly one '{marker}' line in CHANGELOG.md, found {len(at)}.")
          lines.insert(at[0] + 1, f"\n## {ver}\n\n### Changed\n\n{notes}\n")
          p.write_text("".join(lines))
          EOF

          # Chart.yaml changed, so regenerate the README once more to pick up the new version.
          helm-docs --chart-search-root=charts --template-files=README.md.gotmpl

      - name: Commit, tag, release and publish
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.detect.outputs.next }}
          NOTES: ${{ steps.detect.outputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A charts/n8n CHANGELOG.md
          git commit -m "[n8n] Release ${NEXT}" -m "${NOTES}"

          # Rebase first: a Renovate merge can land while this job runs, and the push must fast-forward.
          git pull --rebase --quiet origin main
          git push origin HEAD:main

          # HEAD is what landed on main, so the tag points at it. The tag push uses GITHUB_TOKEN, which
          # triggers nothing, hence the explicit dispatch below.
          git tag -a "v${NEXT}" -m "n8n chart ${NEXT}" -m "${NOTES}" HEAD
          git push origin "v${NEXT}"

          {
            printf '%s\n' "${NOTES}"
            printf 'Install with:\n\n'
            printf '```console\n'
            printf 'helm upgrade --install n8n oci://ghcr.io/%s/n8n --version %s\n' "${{ github.repository_owner }}" "${NEXT}"
            printf '```\n\n'
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for full history.\n' "${{ github.repository }}"
          } > /tmp/release-notes.md

          gh release create "v${NEXT}" --title "n8n chart ${NEXT}" --notes-file /tmp/release-notes.md

          # The tag push above was made with GITHUB_TOKEN, so it does not trigger the tag-driven
          # publish workflow. Dispatch it; CI has already passed for this commit.
          gh workflow run "Publish Chart (OCI)" --ref main
          echo "Released v${NEXT} and dispatched the publish workflow."
