suite: test sandbox service

templates:
  - configmap.yaml
  - sandbox-certificates.yaml
  - sandbox-configmap.yaml
  - sandbox-deployment-api.yaml
  - sandbox-service.yaml
  - sandbox-statefulset-runner.yaml

release:
  name: n8n
  namespace: n8n

chart:
  version: 1.0.0
  appVersion: 1.0.0

# tls.mode defaults to existingSecret, which now requires all four certificate Secret names.
# These match the names the chart used to derive implicitly, so rendered output is unchanged.
set:
  sandboxService:
    tls:
      certificates:
        apiRegistrationServer:
          secretName: n8n-sandbox-api-registration-tls
        apiControlClient:
          secretName: n8n-sandbox-api-control-client-tls
        runnerRegistrationClient:
          secretName: n8n-sandbox-runner-registration-tls
        runnerControlServer:
          secretName: n8n-sandbox-runner-control-tls

tests:
  - it: should render the API configmap with default settings
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-api-config
    template: sandbox-configmap.yaml
    asserts:
      - equal:
          path: data.SANDBOX_API_LISTEN_ADDR
          value: ":8080"
      - equal:
          path: data.SANDBOX_API_GRPC_LISTEN_ADDR
          value: ":9090"
      - equal:
          path: data.SANDBOX_API_STORE
          value: sqlite
      - equal:
          path: data.SANDBOX_API_DATA_DIR
          value: /var/lib/n8n-sandbox-api
      - equal:
          path: data.SANDBOX_API_DEFAULT_MAX_SANDBOXES
          value: "50"
      - equal:
          path: data.SANDBOX_API_MAX_FILE_BYTES
          value: "10485760"
      - equal:
          path: data.SANDBOX_API_RUNNER_HEARTBEAT_GRACE
          value: 45s

  - it: should render the runner configmap with docker and sandbox image settings
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-runner-config
    template: sandbox-configmap.yaml
    asserts:
      - equal:
          path: data.SANDBOX_RUNNER_DOCKER_HOST
          value: unix:///var/run/docker.sock
      - equal:
          path: data.SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE
          value: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.3.4
      - equal:
          path: data.SANDBOX_RUNNER_LISTEN_ADDR
          value: ":8080"
      - equal:
          path: data.SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR
          value: ":9091"
      - equal:
          path: data.SANDBOX_RUNNER_DATA_DIR
          value: /var/sandboxes
      - equal:
          path: data.SANDBOX_RUNNER_CAPACITY_TOTAL
          value: "1000"
      - equal:
          path: data.SANDBOX_RUNNER_DEFAULT_MEMORY_MB
          value: "512"
      - equal:
          path: data.SANDBOX_RUNNER_DEFAULT_CPU_PERCENT
          value: "100"
      - equal:
          path: data.SANDBOX_RUNNER_DEFAULT_PIDS_MAX
          value: "256"

  - it: should render the API deployment with auth and TLS env from the chart-managed secret
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: kind
      value: Deployment
    template: sandbox-deployment-api.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/n8n-io/n8n-sandbox-service-api:1.3.4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_API_KEYS
            valueFrom:
              secretKeyRef:
                name: n8n-sandbox-auth
                key: api-keys
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: n8n-sandbox-auth
                key: runner-registration-token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_API_GRPC_TLS_CERT_FILE
            value: /tls/api-registration/tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
            value: /tls/api-control-client/tls.key

  - it: should mount a PVC for the SQLite store by default
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    template: sandbox-deployment-api.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: should not render a PVC when the store is postgres
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        api:
          store: postgres
    documentSelector:
      path: kind
      value: Deployment
    template: sandbox-deployment-api.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content: persistentVolumeClaim

  - it: should render a privileged runner statefulset with per-pod base URL
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-runner
    template: sandbox-statefulset-runner.yaml
    asserts:
      - equal:
          path: spec.serviceName
          value: n8n-sandbox-runner
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_RUNNER_API_GRPC_ADDR
            value: n8n-sandbox-api:9090
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_RUNNER_HTTP_BASE_URL
            value: https://$(POD_NAME).n8n-sandbox-runner.$(POD_NAMESPACE).svc.cluster.local:8080
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: docker-data
            mountPath: /var/lib/docker

  - it: should use an explicit runner httpBaseUrl when set
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
          httpBaseUrl: https://sandbox.example.com
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-runner
    template: sandbox-statefulset-runner.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_RUNNER_HTTP_BASE_URL
            value: https://sandbox.example.com

  - it: should render the API service with http and grpc ports
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-api
    template: sandbox-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 9090
            targetPort: grpc

  - it: should render the runner service as headless
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-runner
    template: sandbox-service.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: None

  - it: should render no certificates in existingSecret mode
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    template: sandbox-certificates.yaml
    asserts:
      - notContains:
          path: ""
          content: "kind: Certificate"

  - it: should render the api-registration certificate in certManager mode
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          mode: certManager
          certManager:
            issuerRef:
              name: selfsigned
    template: sandbox-certificates.yaml
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-api-registration-tls
    asserts:
      - equal:
          path: spec.commonName
          value: n8n-sandbox-api
      - contains:
          path: spec.dnsNames
          content: n8n-sandbox-api.n8n.svc.cluster.local

  - it: should render the api-control-client certificate in certManager mode
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          mode: certManager
          certManager:
            issuerRef:
              name: selfsigned
    template: sandbox-certificates.yaml
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-api-control-client-tls
    asserts:
      - equal:
          path: spec.commonName
          value: n8n-sandbox-api-control-client

  - it: should render the runner-registration certificate in certManager mode
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          mode: certManager
          certManager:
            issuerRef:
              name: selfsigned
    template: sandbox-certificates.yaml
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-runner-registration-tls
    asserts:
      - equal:
          path: spec.commonName
          value: n8n-sandbox-runner-registration-client

  - it: should render the runner-control certificate with a wildcard per-pod SAN
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          mode: certManager
          certManager:
            issuerRef:
              name: selfsigned
    template: sandbox-certificates.yaml
    documentSelector:
      path: metadata.name
      value: n8n-sandbox-runner-control-tls
    asserts:
      - equal:
          path: spec.commonName
          value: n8n-sandbox-runner
      - matchRegex:
          path: spec.dnsNames[4]
          pattern: "\\*\\.n8n-sandbox-runner\\.n8n\\.svc\\.cluster\\.local"

  - it: should fail when privileged isolation is not acknowledged
    set:
      sandboxService:
        enabled: true
    template: sandbox-statefulset-runner.yaml
    asserts:
      - failedTemplate:
          errorPattern: acknowledgePrivileged=true

  - it: should fail when certManager mode has no issuer
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          mode: certManager
    template: sandbox-statefulset-runner.yaml
    asserts:
      - failedTemplate:
          errorPattern: issuerRef.name is required

  - it: should fail when scaling the API beyond one replica with the sqlite store
    set:
      sandboxService:
        enabled: true
        replicas: 2
        runner:
          acknowledgePrivileged: true
    template: sandbox-statefulset-runner.yaml
    asserts:
      - failedTemplate:
          errorPattern: SQLite store cannot be shared

  - it: should fail on placeholder auth values
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        api:
          store: postgres
        auth:
          apiKeys: changeme123
    template: sandbox-statefulset-runner.yaml
    asserts:
      - failedTemplate:
          errorPattern: looks like a placeholder

  - it: should fail when the assistant points at an external sandbox without URL and key secret
    set:
      aiAssistant:
        enabled: true
        sandbox:
          enabled: true
          provider: external
    template: sandbox-statefulset-runner.yaml
    asserts:
      - failedTemplate:
          errorPattern: outside this cluster

  - it: should render when tls.mode is existingSecret and all four secretNames are set
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          certificates:
            apiRegistrationServer:
              secretName: api-reg
            apiControlClient:
              secretName: api-ctl
            runnerRegistrationClient:
              secretName: runner-reg
            runnerControlServer:
              secretName: runner-ctl
    asserts:
      - notFailedTemplate: {}

  - it: should render when tls.mode is certManager with an issuerRef
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
        tls:
          mode: certManager
          certManager:
            issuerRef:
              name: ca-issuer
              kind: ClusterIssuer
    asserts:
      - notFailedTemplate: {}

  # The sandbox pods previously carried `app.kubernetes.io/name: n8n`, which is exactly what the
  # main n8n Service selects on (that selector has no component label). The Service therefore
  # adopted the sandbox API and runner pods as endpoints, so roughly two thirds of the traffic to
  # the n8n host was answered by the wrong pod - 401s from the sandbox API and 502s from the
  # runner, whose HTTP port serves TLS and rejected the ingress controller's plaintext requests.
  - it: should not carry the main pod selector labels on the sandbox API
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    template: sandbox-deployment-api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: n8n-sandbox-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: n8n-sandbox-api
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: sandbox-api

  - it: should not carry the main pod selector labels on the sandbox runner
    set:
      sandboxService:
        enabled: true
        runner:
          acknowledgePrivileged: true
    template: sandbox-statefulset-runner.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: n8n-sandbox-runner
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: n8n-sandbox-runner
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: sandbox-runner
