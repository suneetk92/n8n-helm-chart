{{- include "n8n.sandbox.validate" . -}}
# -- Instance security and node hardening. Consumed by every n8n container (main, worker, webhook, MCP webhook).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-security-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: {{ .Values.security.enforceSettingsFilePermissions | quote }}
  N8N_BLOCK_ENV_ACCESS_IN_NODE: {{ .Values.security.blockEnvAccessInNode | quote }}
  N8N_GIT_NODE_DISABLE_BARE_REPOS: {{ .Values.security.gitNodeDisableBareRepos | quote }}
{{- if not (kindIs "invalid" .Values.security.restrictFileAccessTo) }}
  N8N_RESTRICT_FILE_ACCESS_TO: {{ .Values.security.restrictFileAccessTo | quote }}
{{- end }}
{{- if .Values.encryptionKeyRotation.enabled }}
  N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION: "true"
{{- end }}
{{- if not (kindIs "invalid" .Values.nodes.exclude) }}
  NODES_EXCLUDE: {{ .Values.nodes.exclude | toJson | quote }}
{{- end }}
{{- if not (kindIs "invalid" .Values.nodes.include) }}
  NODES_INCLUDE: {{ .Values.nodes.include | toJson | quote }}
{{- end }}
{{- if not (kindIs "invalid" .Values.nodes.compression.maxDecompressedSizeBytes) }}
  N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: {{ .Values.nodes.compression.maxDecompressedSizeBytes | int64 | quote }}
{{- end }}
{{- if not (kindIs "invalid" .Values.nodes.compression.maxZipEntries) }}
  N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: {{ .Values.nodes.compression.maxZipEntries | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-database-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
{{- if .Values.db.tablePrefix }}
  DB_TABLE_PREFIX: {{ .Values.db.tablePrefix | quote }}
{{- end }}
{{- if eq .Values.db.type "postgresdb" }}
  DB_TYPE: {{ .Values.db.type | quote }}
  DB_POSTGRESDB_HOST: {{ .Values.externalPostgresql.host | quote }}
  DB_POSTGRESDB_PORT: {{ .Values.externalPostgresql.port | quote }}
  DB_POSTGRESDB_DATABASE: {{ .Values.externalPostgresql.database | quote }}
  DB_POSTGRESDB_POOL_SIZE: {{ .Values.db.postgresdb.poolSize | quote }}
  DB_POSTGRESDB_CONNECTION_TIMEOUT: {{ .Values.db.postgresdb.connectionTimeout | quote }}
  DB_POSTGRESDB_IDLE_CONNECTION_TIMEOUT: {{ .Values.db.postgresdb.idleConnectionTimeout | quote }}
  DB_POSTGRESDB_SCHEMA: {{ .Values.db.postgresdb.schema | quote }}
  {{- if .Values.db.postgresdb.ssl.enabled }}
  DB_POSTGRESDB_SSL_ENABLED: {{ .Values.db.postgresdb.ssl.enabled | quote }}
  {{- if eq (include "n8n.postgres.ssl.hasCA" .) "true" }}
  DB_POSTGRESDB_SSL_CA: "/home/node/certs/ca/ca.crt"
  {{- end }}
  {{- if eq (include "n8n.postgres.ssl.hasCert" .) "true" }}
  DB_POSTGRESDB_SSL_CERT: "/home/node/certs/cert/cert.crt"
  {{- end }}
  {{- if eq (include "n8n.postgres.ssl.hasKey" .) "true" }}
  DB_POSTGRESDB_SSL_KEY: "/home/node/certs/key/cert.key"
  {{- end }}
  {{- end }}
{{- else }}
  DB_TYPE: {{ .Values.db.type | default "sqlite" }}
  DB_SQLITE_VACUUM_ON_STARTUP: {{ .Values.db.sqlite.vacuum | quote }}
  DB_SQLITE_POOL_SIZE: {{ .Values.db.sqlite.poolSize | quote }}
{{- end }}
{{- if .Values.db.logging.enabled }}
  DB_LOGGING_ENABLED: "true"
  DB_LOGGING_OPTIONS: {{ .Values.db.logging.options | quote }}
  DB_LOGGING_MAX_EXECUTION_TIME: {{ .Values.db.logging.maxQueryExecutionTime | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-logging-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_LOG_LEVEL: {{ .Values.log.level | quote }}
  N8N_LOG_FORMAT: {{ .Values.log.format | quote }}
  N8N_LOG_OUTPUT: {{ join "," .Values.log.output | quote }}
{{- if has "file" .Values.log.output }}
  N8N_LOG_FILE_COUNT_MAX: {{ .Values.log.file.maxcount | quote }}
  N8N_LOG_FILE_SIZE_MAX: {{ .Values.log.file.maxsize | quote }}
  N8N_LOG_FILE_LOCATION: {{ .Values.log.file.location | quote }}
{{- end }}
{{- if gt (len .Values.log.scopes) 0 }}
  N8N_LOG_SCOPES: {{ join "," .Values.log.scopes | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-diagnostics-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_DIAGNOSTICS_ENABLED: {{ .Values.diagnostics.enabled | quote }}
{{- if .Values.diagnostics.enabled }}
  N8N_DIAGNOSTICS_CONFIG_FRONTEND: {{ .Values.diagnostics.frontendConfig | quote }}
  N8N_DIAGNOSTICS_CONFIG_BACKEND: {{ .Values.diagnostics.backendConfig | quote }}
  N8N_DIAGNOSTICS_POSTHOG_API_KEY: {{ .Values.diagnostics.postHog.apiKey | quote }}
  N8N_DIAGNOSTICS_POSTHOG_API_HOST: {{ .Values.diagnostics.postHog.apiHost | quote }}
{{- else }}
  N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
  N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
  N8N_DIAGNOSTICS_POSTHOG_API_KEY: ""
  N8N_DIAGNOSTICS_POSTHOG_API_HOST: ""
{{- end }}
{{- if .Values.sentry.enabled }}
  N8N_SENTRY_DSN: {{ .Values.sentry.backendDsn | quote }}
  N8N_FRONTEND_SENTRY_DSN: {{ .Values.sentry.frontendDsn | quote }}
  N8N_VERSION: {{ default .Chart.AppVersion .Values.image.tag | quote }}
  ENVIRONMENT: "production"
  DEPLOYMENT_NAME: {{ .Release.Name | quote }}
{{- else }}
  N8N_SENTRY_DSN: ""
  N8N_FRONTEND_SENTRY_DSN: ""
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-version-notifications-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_VERSION_NOTIFICATIONS_ENABLED: {{ .Values.versionNotifications.enabled | quote }}
{{- if .Values.versionNotifications.enabled }}
  N8N_VERSION_NOTIFICATIONS_ENDPOINT: {{ .Values.versionNotifications.endpoint | quote }}
  N8N_VERSION_NOTIFICATIONS_INFO_URL: {{ .Values.versionNotifications.infoUrl | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-public-api-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_PUBLIC_API_DISABLED: {{ not .Values.api.enabled | quote }}
  N8N_PUBLIC_API_ENDPOINT: {{ .Values.api.path | quote }}
  N8N_PUBLIC_API_SWAGGERUI_DISABLED: {{ not .Values.api.swagger.enabled | quote }}
{{- if and (eq .Values.db.type "postgresdb") (or (eq .Values.worker.mode "queue") (eq .Values.webhook.mode "queue")) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-queue-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  EXECUTIONS_MODE: "queue"
  QUEUE_BULL_REDIS_DB: {{ .Values.externalRedis.database | quote }}
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  {{- if and .Values.externalRedis.clusterNodes (gt (len .Values.externalRedis.clusterNodes) 0) }}
    {{- $nodeList := list }}
    {{- range .Values.externalRedis.clusterNodes }}
      {{- $nodeList = append $nodeList (printf "%s:%d" .host (int .port)) }}
    {{- end }}
  QUEUE_BULL_REDIS_CLUSTER_NODES: {{ (join "," $nodeList) | quote }}
  {{- else }}
  QUEUE_BULL_REDIS_HOST: {{ .Values.externalRedis.host | quote }}
  QUEUE_BULL_REDIS_PORT: {{ .Values.externalRedis.port | quote }}
  {{- end }}
  {{- if eq .Values.webhook.mode "queue" }}
  N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"
  {{- end }}
  {{- if .Values.externalRedis.tls.enabled }}
  QUEUE_BULL_REDIS_TLS: {{ .Values.externalRedis.tls.enabled | quote }}
  {{- end }}
  QUEUE_BULL_REDIS_DUALSTACK: {{ .Values.externalRedis.dualStack | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-workflow-history-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_WORKFLOW_HISTORY_ENABLED: {{ .Values.workflowHistory.enabled | quote }}
  N8N_WORKFLOW_HISTORY_PRUNE_TIME: {{ .Values.workflowHistory.pruneTime | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-task-broker-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_RUNNERS_MODE: {{ .Values.taskRunners.mode | quote }}
  N8N_RUNNERS_TASK_TIMEOUT: {{ .Values.taskRunners.taskTimeout | quote }}
  N8N_RUNNERS_HEARTBEAT_INTERVAL: {{ .Values.taskRunners.taskHeartbeatInterval | quote }}
{{- if eq .Values.taskRunners.mode "external" }}
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: {{ .Values.taskRunners.broker.address | quote }}
  N8N_RUNNERS_BROKER_PORT: {{ .Values.taskRunners.broker.port | quote }}
{{- else }}
  N8N_RUNNERS_MAX_CONCURRENCY: {{ .Values.taskRunners.maxConcurrency | quote }}
{{- end }}
{{- if .Values.nodes.python.enabled }}
  N8N_NATIVE_PYTHON_RUNNER: "true"
{{- if .Values.nodes.python.builtin.modules }}
  N8N_RUNNERS_STDLIB_ALLOW: {{ .Values.nodes.python.builtin.modules | join "," | quote }}
{{- end }}
{{- if .Values.nodes.python.external.allowAll }}
  N8N_RUNNERS_EXTERNAL_ALLOW: "*"
{{- else if .Values.nodes.python.external.packages }}
  N8N_RUNNERS_EXTERNAL_ALLOW: {{ .Values.nodes.python.external.packages | join "," | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-metrics-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_METRICS: {{ .Values.serviceMonitor.enabled | quote }}
  N8N_METRICS_PREFIX: {{ .Values.serviceMonitor.metricsPrefix | quote }}
  N8N_METRICS_INCLUDE_DEFAULT_METRICS: {{ .Values.serviceMonitor.include.defaultMetrics | quote }}
  N8N_METRICS_INCLUDE_CACHE_METRICS: {{ .Values.serviceMonitor.include.cacheMetrics | quote }}
  N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: {{ .Values.serviceMonitor.include.messageEventBusMetrics | quote }}
  N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: {{ .Values.serviceMonitor.include.workflowIdLabel | quote }}
  N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: {{ .Values.serviceMonitor.include.nodeTypeLabel | quote }}
  N8N_METRICS_INCLUDE_CREDENTIAL_TYPE_LABEL: {{ .Values.serviceMonitor.include.credentialTypeLabel | quote }}
  N8N_METRICS_INCLUDE_API_ENDPOINTS: {{ .Values.serviceMonitor.include.apiEndpoints | quote }}
  N8N_METRICS_INCLUDE_API_PATH_LABEL: {{ .Values.serviceMonitor.include.apiPathLabel | quote }}
  N8N_METRICS_INCLUDE_API_METHOD_LABEL: {{ .Values.serviceMonitor.include.apiMethodLabel | quote }}
  N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL: {{ .Values.serviceMonitor.include.apiStatusCodeLabel | quote }}
  N8N_METRICS_INCLUDE_QUEUE_METRICS: {{ .Values.serviceMonitor.include.queueMetrics | quote }}
{{- if eq .Values.taskRunners.mode "external" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.taskRunners.fullname" . }}-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_RUNNERS_LAUNCHER_LOG_LEVEL: {{ .Values.log.level | quote }}
  N8N_RUNNERS_MAX_CONCURRENCY: {{ .Values.taskRunners.maxConcurrency | quote }}
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: {{ .Values.taskRunners.external.autoShutdownTimeout | quote }}
  N8N_RUNNERS_TASK_TIMEOUT: {{ .Values.taskRunners.taskTimeout | quote }}
  N8N_RUNNERS_TASK_BROKER_URI: {{ (printf "http://%s:%d" .Values.taskRunners.broker.address (.Values.taskRunners.broker.port | int)) | quote }}
  N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: {{ .Values.taskRunners.external.port | quote }}
  NODE_OPTIONS: {{ .Values.taskRunners.external.nodeOptions | join " " | quote }}
  GENERIC_TIMEZONE: {{ .Values.timezone | quote }}
{{- if .Values.sentry.enabled }}
  SENTRY_DSN: {{ .Values.sentry.externalTaskRunnersDsn | quote }}
  N8N_VERSION: {{ default .Chart.AppVersion .Values.image.tag | quote }}
  ENVIRONMENT: "production"
  DEPLOYMENT_NAME: {{ .Release.Name | quote }}
{{- else }}
  SENTRY_DSN: ""
{{- end }}
{{- if .Values.nodes.python.enabled }}
{{- if .Values.nodes.python.builtin.modules }}
  N8N_RUNNERS_STDLIB_ALLOW: {{ .Values.nodes.python.builtin.modules | join "," | quote }}
{{- end }}
{{- if .Values.nodes.python.external.allowAll }}
  N8N_RUNNERS_EXTERNAL_ALLOW: "*"
{{- else if .Values.nodes.python.external.packages }}
  N8N_RUNNERS_EXTERNAL_ALLOW: {{ .Values.nodes.python.external.packages | join "," | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.license.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-license-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
{{- $licenseAutoRenewEnabled := .Values.license.autoRenew.enabled }}
{{- if not (kindIs "invalid" .Values.license.autoNenew.enabled) }}
  {{- $licenseAutoRenewEnabled = .Values.license.autoNenew.enabled }}
{{- end }}
{{- $licenseAutoRenewOffsetInHours := .Values.license.autoRenew.offsetInHours }}
{{- if not (kindIs "invalid" .Values.license.autoNenew.offsetInHours) }}
  {{- $licenseAutoRenewOffsetInHours = .Values.license.autoNenew.offsetInHours }}
{{- end }}
  N8N_LICENSE_AUTO_RENEW_ENABLED: {{ $licenseAutoRenewEnabled | quote }}
  N8N_LICENSE_AUTO_RENEW_OFFSET: {{ $licenseAutoRenewOffsetInHours | mul 3600 | quote }}
  N8N_LICENSE_SERVER_URL: {{ .Values.license.serverUrl | quote }}
  {{- if ne (int .Values.license.tenantId) 1 }}
  N8N_LICENSE_TENANT_ID: {{ .Values.license.tenantId | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-binary-data-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
{{- if not (kindIs "invalid" .Values.binaryData.mode) }}
  N8N_DEFAULT_BINARY_DATA_MODE: {{ .Values.binaryData.mode | quote }}
{{- end }}
{{- if and (eq .Values.binaryData.mode "filesystem") (ne .Values.binaryData.localStoragePath "") }}
  N8N_BINARY_DATA_STORAGE_PATH: {{ .Values.binaryData.localStoragePath | quote }}
{{- end }}
{{- if eq .Values.binaryData.mode "database" }}
  N8N_BINARY_DATA_DATABASE_MAX_FILE_SIZE: {{ .Values.binaryData.databaseMaxFileSize | quote }}
{{- end }}
{{- if eq .Values.binaryData.mode "s3" }}
  N8N_EXTERNAL_STORAGE_S3_HOST: {{ .Values.binaryData.s3.host | quote }}
  N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME: {{ .Values.binaryData.s3.bucketName | quote }}
  N8N_EXTERNAL_STORAGE_S3_BUCKET_REGION: {{ .Values.binaryData.s3.bucketRegion | quote }}
{{- end }}
---
# -- Execution lifecycle, request-size limits and the durable scheduler. Consumed by every n8n container (main, worker, webhook, MCP webhook).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-operations-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  EXECUTIONS_TIMEOUT: {{ .Values.operations.timeout | quote }}
  EXECUTIONS_TIMEOUT_MAX: {{ .Values.operations.timeoutMax | quote }}
  EXECUTIONS_DATA_SAVE_ON_ERROR: {{ .Values.operations.saveDataOnError | quote }}
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: {{ .Values.operations.saveDataOnSuccess | quote }}
  EXECUTIONS_DATA_SAVE_ON_PROGRESS: {{ .Values.operations.saveDataOnProgress | quote }}
  EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: {{ .Values.operations.saveDataManualExecutions | quote }}
  EXECUTIONS_DATA_PRUNE: {{ .Values.operations.pruneData | quote }}
  EXECUTIONS_DATA_MAX_AGE: {{ .Values.operations.pruneDataMaxAge | quote }}
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: {{ .Values.operations.pruneDataMaxCount | quote }}
  EXECUTIONS_DATA_HARD_DELETE_BUFFER: {{ .Values.operations.pruneDataHardDeleteBuffer | quote }}
  N8N_PAYLOAD_SIZE_MAX: {{ .Values.operations.payloadSizeMax | quote }}
  N8N_FORMDATA_FILE_SIZE_MAX: {{ .Values.operations.formDataFileSizeMax | quote }}
  EXECUTIONS_DATA_MAX_DISPLAY_SIZE: {{ .Values.operations.maxDisplaySize | int64 | quote }}
{{- if .Values.durableScheduler.enabled }}
  N8N_SCHEDULER_ENABLED: "true"
  # The scheduler only takes over triggers once the workflow publication service is on; enabling one without the
  # other is a documented silent no-op, so the chart turns both on together.
  N8N_USE_WORKFLOW_PUBLICATION_SERVICE: "true"
  {{- if .Values.durableScheduler.pollTriggers }}
  N8N_SCHEDULER_POLL_TRIGGERS_ENABLED: "true"
    {{- if .Values.durableScheduler.durableCursors }}
  N8N_POLLER_DURABLE_CURSORS_ENABLED: "true"
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.durableScheduler.allowSkip }}
  N8N_ENV_FEAT_SKIP_DURABLE_SCHEDULER: "true"
{{- end }}
{{- if or .Values.smtp.enabled .Values.instanceOwner.enabled }}
---
# -- Outbound email and instance-owner bootstrap. Consumed by every n8n container (main, worker, webhook, MCP webhook).
#   The SMTP password and the owner password hash live in a Secret, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-email-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  {{- if .Values.smtp.enabled }}
  N8N_EMAIL_MODE: "smtp"
  N8N_SMTP_HOST: {{ .Values.smtp.host | quote }}
  N8N_SMTP_PORT: {{ .Values.smtp.port | quote }}
  N8N_SMTP_USER: {{ .Values.smtp.user | quote }}
  N8N_SMTP_SENDER: {{ .Values.smtp.sender | quote }}
  N8N_SMTP_SSL: {{ .Values.smtp.ssl | quote }}
  N8N_SMTP_STARTTLS: {{ .Values.smtp.startTls | quote }}
  {{- end }}
  {{- if .Values.instanceOwner.enabled }}
  N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
  N8N_INSTANCE_OWNER_EMAIL: {{ .Values.instanceOwner.email | quote }}
  N8N_INSTANCE_OWNER_FIRST_NAME: {{ .Values.instanceOwner.firstName | quote }}
  N8N_INSTANCE_OWNER_LAST_NAME: {{ .Values.instanceOwner.lastName | quote }}
  {{- end }}
{{- end }}
---
# -- SSRF protection for outbound requests. Consumed by every n8n container when enabled.
{{- if .Values.ssrfProtection.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-ssrf-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_SSRF_PROTECTION_ENABLED: "true"
  {{- with .Values.ssrfProtection.allowedHostnames }}
  N8N_SSRF_ALLOWED_HOSTNAMES: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.ssrfProtection.allowedIpRanges }}
  N8N_SSRF_ALLOWED_IP_RANGES: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.ssrfProtection.blockedIpRanges }}
  N8N_SSRF_BLOCKED_IP_RANGES: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.ssrfProtection.blockedHostnames }}
  N8N_SSRF_BLOCKED_HOSTNAMES: {{ join "," . | quote }}
  {{- end }}
  N8N_SSRF_DNS_CACHE_MAX_SIZE: {{ .Values.ssrfProtection.dnsCacheMaxSize | quote }}
{{- end }}
---
# -- n8n Assistant / agents configuration. Consumed by every n8n container when `aiAssistant.enabled`.
#   API keys are delivered through the AI Secret, not here.
{{- if .Values.aiAssistant.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "n8n.fullname" . }}-ai-configmap
  labels:
    app: {{ include "n8n.name" . }}
    chart: {{ include "n8n.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  N8N_ENABLED_MODULES: {{ join "," .Values.aiAssistant.modules | quote }}
  N8N_INSTANCE_AI_MODEL: {{ .Values.aiAssistant.model | quote }}
  {{- if .Values.aiAssistant.modelUrl }}
  N8N_INSTANCE_AI_MODEL_URL: {{ .Values.aiAssistant.modelUrl | quote }}
  {{- end }}
  {{- if .Values.aiAssistant.mcpServers }}
  N8N_INSTANCE_AI_MCP_SERVERS: {{ .Values.aiAssistant.mcpServers | quote }}
  {{- end }}
  {{- if .Values.aiAssistant.sandbox.enabled }}
  N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
  N8N_INSTANCE_AI_SANDBOX_PROVIDER: {{ .Values.aiAssistant.sandbox.provider | quote }}
  N8N_SANDBOX_SERVICE_URL: {{ include "n8n.sandbox.serviceUrl" . | quote }}
  {{- end }}
