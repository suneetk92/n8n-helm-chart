name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'charts/**'

env:
  HELM_VERSION: v3.18.3
  HELM_UNITTEST_VERSION: v0.8.2
  HELM_DOCS_VERSION: v1.14.2

jobs:
  check-helm-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install helm-docs
        run: |
          VERSION="${{ env.HELM_DOCS_VERSION }}"
          VERSION_NUMBER="${VERSION#v}"
          wget -q -O /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${VERSION}/helm-docs_${VERSION_NUMBER}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo mv /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Run helm-docs
        run: helm-docs --chart-search-root=charts --template-files=README.md.gotmpl

      - name: Check for README drift
        run: |
          if ! git diff --exit-code charts/n8n/README.md; then
            echo "README.md is out of date — run helm-docs locally and commit the updated file"
            exit 1
          fi

  lint-test:
    needs: check-helm-docs

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.HELM_UNITTEST_VERSION }}

      # Also validates values.schema.json against values.yaml.
      - name: helm lint
        run: helm lint charts/n8n

      - name: helm unittest
        run: helm unittest --strict --file 'unittests/**/*.yaml' charts/n8n

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: Install into kind
        run: |
          helm install n8n charts/n8n \
            --values charts/n8n/values-kind.yaml \
            --wait --timeout 600s
          helm test n8n --timeout 300s || true
          kubectl get pods -A
