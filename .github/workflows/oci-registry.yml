name: Publish Chart (OCI)

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/n8n/**'

  workflow_dispatch:

env:
  HELM_VERSION: v3.18.3

jobs:
  publish-oci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          version=$(yq eval '.version' charts/n8n/Chart.yaml)
          echo "::group::Publishing n8n:${version}"
          helm package charts/n8n --destination ./dist
          # ghcr.io/<owner>/n8n:<version> — the registry path is the owner, so the chart stays flat
          helm push "dist/n8n-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}"
          echo "::endgroup::"

      - name: Remove published artifacts
        if: always()
        run: rm -f dist/*.tgz
