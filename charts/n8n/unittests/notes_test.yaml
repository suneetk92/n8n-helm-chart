suite: Test NOTES.txt

templates:
  - NOTES.txt

tests:
  - it: should not show deprecation notices when no deprecated fields are set
    set: {}
    asserts:
      - matchRegex:
          path: raw
          pattern: "1\\. Get the application URL by running these commands:"
      - notMatchRegex:
          path: raw
          pattern: "WARNING: We detected deprecated root level .* configuration usage"

  - it: should not show autoNenew deprecation warning when autoNenew fields are null
    set: {}
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "WARNING: license.autoNenew is deprecated"

  - it: should not show binaryData.availableModes deprecation warning when it is empty
    set: {}
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "WARNING: binaryData.availableModes is deprecated and ignored"

  - it: should warn about the one-way encryption key rotation migration when enabled
    set:
      encryptionKeyRotation:
        enabled: true
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: encryptionKeyRotation.enabled is on"

  - it: should not warn about encryption key rotation by default
    set: {}
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "WARNING: encryptionKeyRotation.enabled is on"
