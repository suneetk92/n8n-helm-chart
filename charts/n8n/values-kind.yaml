log:
  level: info

db:
  type: sqlite

worker:
  mode: regular
  count: 1

  waitMainNodeReady:
    enabled: true

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 5

  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 5

webhook:
  mode: regular
  count: 1

  waitMainNodeReady:
    enabled: true

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 5

  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 5

nodes:
  # The npm-install init container renders only when nodes.external.packages is non-empty, so without
  # this the node image was merely templated, never pulled or run — a node major bump could break the
  # image, npm, or the volume permissions and still go green. One tiny non-community package is enough:
  # it lands in /npmdata rather than /nodesdata/nodes, so n8n never tries to load it as a node.
  external:
    packages:
      - "is-odd@3.0.1"

  python:
    enabled: true
    builtin:
      modules:
        - "*"
    external:
      packages:
        - numpy
        - pandas

taskRunners:
  mode: external
  external:
    image:
      repository: n8nio/runners
      pullPolicy: IfNotPresent
      tag: ""
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
