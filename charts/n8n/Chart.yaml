apiVersion: v2
name: n8n
description: A Helm chart for fair-code workflow automation platform with native AI capabilities. Combine visual building with custom code, self-host or cloud, 400+ integrations.
icon: https://avatars1.githubusercontent.com/u/45487711?s=200&v=4
# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application
# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 2.0.0
# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "2.38.4"
kubeVersion: ">=1.23.0-0"
home: https://n8n.io
maintainers:
  - name: burakince
    email: burak.ince@linux.org.tr
    url: https://www.burakince.com
sources:
  - https://github.com/community-charts/helm-charts
  - https://github.com/n8n-io/n8n
keywords:
  - n8n
  - Workflow Automation
  - Workflow
  - Automation
  - iPaaS
  - integration-framework
  - low-code-plattform
  - low-code
annotations:
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/community-charts/helm-charts
    - name: Chart Usage Page
      url: https://community-charts.github.io/docs/charts/n8n/usage
    - name: Upstream Project
      url: https://github.com/n8n-io/n8n
    - name: Official Documentation
      url: https://docs.n8n.io/
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |-
    - kind: removed
      description: "`N8N_AVAILABLE_BINARY_DATA_MODES` is no longer rendered. n8n 2.0 dropped the variable, so `binaryData.availableModes` had no effect; it is now accepted for one release and emits a NOTES warning."
      links:
        - name: Official Documentation
          url: https://docs.n8n.io/changelog/v20-breaking-changes
    - kind: removed
      description: "`default` (in-memory) is no longer a valid `binaryData.mode`. Valid values are `filesystem`, `database` and `s3`; the chart default is now unset so n8n picks `filesystem` in regular mode and `database` in queue mode."
      links:
        - name: Official Documentation
          url: https://docs.n8n.io/changelog/v20-breaking-changes
    - kind: changed
      description: "New `<release>-security-configmap`, consumed by every n8n container, carries the instance security settings that n8n 2.0 changed its defaults for: `security.enforceSettingsFilePermissions`, `security.blockEnvAccessInNode`, `security.gitNodeDisableBareRepos` and `security.restrictFileAccessTo`."
      links:
        - name: Official Documentation
          url: https://docs.n8n.io/changelog/v20-breaking-changes
    - kind: changed
      description: "`N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS` moved out of the hardcoded container environment into the security ConfigMap and is now configurable."
    - kind: changed
      description: "`db.sqlite.poolSize` is now rendered as `DB_SQLITE_POOL_SIZE` and defaults to `3`. n8n 2.0 removed the legacy non-pool SQLite driver and rejects `0`, which the chart previously shipped as the default."
      links:
        - name: Official Documentation
          url: https://docs.n8n.io/changelog/v20-breaking-changes
    - kind: added
      description: "`nodes.exclude` and `nodes.include` (`NODES_EXCLUDE` / `NODES_INCLUDE`). n8n 2.0 excludes `n8n-nodes-base.executeCommand` and `n8n-nodes-base.localFileTrigger` by default; set `nodes.exclude: []` to load every node."
    - kind: added
      description: "`nodes.compression.maxDecompressedSizeBytes` and `nodes.compression.maxZipEntries`, needed to restore the pre-3.0 limits after n8n 3.0 lowered them to 256 MiB / 1000 ZIP entries."
      links:
        - name: Official Documentation
          url: https://docs.n8n.io/changelog/v30-breaking-changes
    - kind: added
      description: "`encryptionKeyRotation.enabled` (`N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION`). The chart keeps it `false` because the migration is one-way and irreversible; see the Upgrading section in the README before enabling it."
      links:
        - name: Official Documentation
          url: https://docs.n8n.io/changelog/v30-breaking-changes
    - kind: added
      description: "`binaryData.databaseMaxFileSize` (`N8N_BINARY_DATA_DATABASE_MAX_FILE_SIZE`) for the `database` binary data mode."
  artifacthub.io/images: |
    - name: n8n
      image: n8nio/n8n:2.38.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: n8n-runners
      image: n8nio/runners:2.38.4
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/license: Apache-2.0
  artifacthub.io/maintainers: |
    - name: burakince
      email: burak.ince@linux.org.tr
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/screenshots: |-
    []
  artifacthub.io/signKey: |
    fingerprint: 939B1A0ED8AAA8E722ACCDB3B6A012EE8A76426A
    url: https://keybase.io/communitycharts/pgp_keys.asc
dependencies:
  - name: redis
    version: 28.0.15
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 18.10.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
