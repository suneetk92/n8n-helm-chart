name: Publish Chart (OCI)

# Publishes only tagged versions, so every artifact in the registry corresponds to a `v*` tag.
#
# A tag pushed by GITHUB_TOKEN does not trigger workflows, so chart-version.yml dispatches this
# workflow explicitly after it tags. Tags pushed by a human trigger it directly, and in that case we
# verify CI passed for the tagged commit first — OCI tags are immutable, so a bad publish burns a
# version.
on:
  push:
    tags: [ 'v*' ]

  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to publish (defaults to the current branch)"
        required: false

concurrency:
  group: chart-publish
  cancel-in-progress: false

env:
  HELM_VERSION: v3.18.3

jobs:
  publish-oci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Only for human-pushed tags. A dispatch from chart-version.yml points at a commit whose content
      # CI passed on the release pull request that merged it; the squashed commit on main has no run of
      # its own, so this gate would fail it, which is exactly why that path dispatches rather than
      # relying on the tag.
      - name: Require a passing CI run for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // "none"')
          echo "CI conclusion for ${sha}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run for ${sha}. Push the commit to main, let CI pass, then tag it."
            exit 1
          fi

      - name: Resolve chart version
        id: chart
        run: echo "version=$(yq eval '.version' charts/n8n/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already published
        id: check
        run: |
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/n8n" \
               --version "${{ steps.chart.outputs.version }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "n8n ${{ steps.chart.outputs.version }} is already published; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.already == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        if: steps.check.outputs.already == 'false'
        run: |
          echo "::group::Publishing n8n:${{ steps.chart.outputs.version }}"
          helm package charts/n8n --destination ./dist
          # ghcr.io/<owner>/n8n:<version> — the registry path is the owner, so the chart stays flat
          helm push "dist/n8n-${{ steps.chart.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}"
          echo "::endgroup::"

      - name: Remove published artifacts
        if: always()
        run: rm -f dist/*.tgz
